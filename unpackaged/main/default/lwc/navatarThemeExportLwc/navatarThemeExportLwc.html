<template>
    <!-- <template if:true={isModalOpen}> -->
        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open mainContainer">
            <div class="slds-modal__container">
                <!-- Modal/Popup Box header here -->
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small" title="Close">
                        </lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate header_text">Export To Excel</h2>

                </header>
                <div class="slds-modal__content slds-p-vertical_small" id="modal-content-id-1">
                    <div class="slds-form-element slds-m-horizontal_medium slds-p-horizontal_medium">
                        <lightning-layout>
                            <lightning-layout-item size="12">
                                <div class="slds-border_left slds-border_right slds-border_top slds-m-top_small">
                                    <lightning-datatable key-field="id" data={popupDataToDisplay} resize-column-disabled="true"
                                        columns={columns} selected-rows={selectedRows} onrowselection={getSelectedRec}
                                        class="exporttheme tabcont">
                                    </lightning-datatable>
                                </div>
                                <!-- <lightning-input class="slds-text-align_right slds-m-top_x-small" type="checkbox" label="Include all contacts for each firm" name="input1"></lightning-input> -->
                            </lightning-layout-item>
                        </lightning-layout>
                    </div>
                </div>
                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer cutomFooter">
                    <lightning-button label="Cancel" title="Cancel" onclick={closeModal} class="slds-m-left_x-small">
                    </lightning-button>
                    <lightning-button variant="brand" label="Export" title="Export" onclick={exportRecordsModal}
                        class="slds-m-left_x-small customBrandButton"></lightning-button>
                    <c-navatar-export-lwc></c-navatar-export-lwc>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
        </div>
        </section>


    <!-- </template> -->
</template>

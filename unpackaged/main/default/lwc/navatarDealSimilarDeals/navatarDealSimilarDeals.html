<template>
    <div>

        <!-- Header: title | spacer | AI matched + Search -->
        <div class="slds-p-horizontal_medium slds-p-vertical_small slds-border_bottom">
            <lightning-layout vertical-align="center">
                <lightning-layout-item flexibility="auto">
                    <lightning-formatted-text value="Similar Deals" class="slds-text-heading_small slds-text-title_bold"></lightning-formatted-text>
                </lightning-layout-item>
                <lightning-layout-item flexibility="no-flex" class="slds-m-right_small">
                    <lightning-formatted-text value="AI matched" class="slds-text-body_small slds-text-color_weak"></lightning-formatted-text>
                </lightning-layout-item>
                <lightning-layout-item flexibility="no-flex">
                    <lightning-input
                        type="search"
                        placeholder="Search deals..."
                        variant="label-hidden"
                        label="Search deals"
                        onchange={handleSearch}>
                    </lightning-input>
                </lightning-layout-item>
            </lightning-layout>
        </div>

        <!-- Data table -->
        <div class="slds-m-top_small">
            <lightning-datatable
                key-field="id"
                data={filteredDeals}
                columns={columns}
                onrowaction={handleRowAction}
                hide-checkbox-column>
            </lightning-datatable>
        </div>

        <!-- Detail modal -->
        <template if:true={selectedDeal}>
            <div role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="deal-modal-heading"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <div class="slds-modal__header">
                        <lightning-button-icon
                            class="slds-modal__close"
                            icon-name="utility:close"
                            variant="bare-inverse"
                            size="large"
                            alternative-text="Close"
                            onclick={handleCloseDetail}>
                        </lightning-button-icon>
                        <h2 id="deal-modal-heading" class="slds-modal__title">{selectedDeal.deal}</h2>
                    </div>
                    <div class="slds-modal__content slds-p-around_medium">
                        <p class="slds-text-heading_small slds-m-bottom_xx-small">{selectedDeal.company}</p>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium">{selectedDeal.sector} · {selectedDeal.source} · {selectedDeal.year}</p>
                        <div class="slds-grid slds-wrap slds-gutters_small slds-m-bottom_medium">
                            <div class="slds-col slds-size_1-of-3">
                                <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">EV</p>
                                <p class="slds-text-body_small">{selectedDeal.ev}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">Entry Multiple</p>
                                <p class="slds-text-body_small">{selectedDeal.multiple}</p>
                            </div>
                            <div class="slds-col slds-size_1-of-3">
                                <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">Year</p>
                                <p class="slds-text-body_small">{selectedDeal.year}</p>
                            </div>
                        </div>
                        <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">Relevance to Project Everest</p>
                        <p class="slds-text-body_small slds-m-bottom_medium">{selectedDeal.relevance}</p>
                        <p class="slds-text-title_caps slds-text-color_weak slds-m-bottom_xx-small">Detail</p>
                        <p class="slds-text-body_small slds-text-longform">{selectedDeal.detail}</p>
                    </div>
                    <div class="slds-modal__footer">
                        <lightning-button label="Close" onclick={handleCloseDetail}></lightning-button>
                    </div>
                </div>
            </div>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

    </div>
</template>

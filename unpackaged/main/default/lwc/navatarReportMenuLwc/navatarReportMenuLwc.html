<template>
    <div class="slds-p-bottom_medium">
        <template if:true={isReportFound}>
            <template for:each={data} for:item="report">
                <div class="slds-grid slds-m-vertical_medium slds-p-horizontal_medium slds-grid_align-center" key={report.reportName}>	
                    <div class="slds-col slds-size_1-of-3 slds-p-horizontal_x-small">
                        <!-- <lightning-icon icon-name="standard:account" size="small"></lightning-icon>&nbsp;&nbsp; -->
                        <!-- UI-fix for bug 31287 added title tooltip was missing 20-09-22 -->
                        <!-- UI-fix added text class to truncate 31449 -->
                        <span><a href={report.reportURL} target="_blank" class="list slds-truncate text" title={report.reportName}>{report.reportName}</a></span>
                    </div>
                    <div class="slds-col slds-order_1 slds-large-order_2 slds-size_2-of-3 slds-p-horizontal_x-small text">
                        <!-- UI-fix for bug 31287 added title tooltip was missing 20-09-22 -->
                        <!-- UI-fix added text class to truncate 31449 -->
                        <span class="text" title={report.reportDescription}>{report.reportDescription}</span>
                    </div>
                </div>
            </template>
        </template>
        <template if:false={isReportFound}>
            No Records Found
        </template>
        
    </div>
 </template>

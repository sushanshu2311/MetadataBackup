<!--
** Module Name : Acuity 1.0 - Acuity
** Description : Displays the Acuity information of Acuity 1.0 including Referenced, Contacts/Connections, Interactions Section.
** Throws : NA
** Calls : NA
** Organization : Navatar Group
** Product Name & Version : Acuity 1.0
** Revision History:-
** Version    Date(YYYY-MM-DD)    Author         Description of Action
** 1.0        2022-09-07          Lakshya        Acuity Phase 1
** 2.0        2022-12-04          Lakshya        Acuity Phase 2
** 2.1        2023-09-22          Lakshya        PE Patch 3 Fix
** 3.0        2024-02-13          Lakshya        Sharing Model Implementation/Acuity Phase 3
-->
<template>
    <!--SPINNER : START-->
    <template if:true={enableSpinner}>
        <lightning-spinner alternative-text="Loading..." style="z-index:15002">
        </lightning-spinner>
    </template>
    <!--SPINNER : END-->

    <div class="slds-theme_default main-Container main-cont padding_lr_mob">
        <div class="slds-grid slds-wrap">
            <div class="slds-col slds-size_1-of-1">
                <div class="slds-grid slds-wrap">
                    <!-- Moved existing code inside template if by LK on 2024-10-15 to fix 00047628 -->
                    <template if:false={isMobile}>
                        <!--Start Notifications-->
                        <div class="slds-col slds-size_1-of-1 slds-m-bottom_x-small for_desk">
                            <!-- Custom Notification Part Start-->
                            <c-navatar-acuity-notification-lwc record-id={recordId}></c-navatar-acuity-notification-lwc>
                            <!-- Custom Notification Part End-->
                        </div>
                        <!--End Notifications-->
                    </template>

                    <!--Start Mobile all interaction -->
                    <div class="for_mob slds-m-top_small">
                        <template if:true={displayInteractionsMob}>
                            <c-navatar-acuity-redirection-lwc header={interactionsMobHeader}
                                                        act-id-list={interactionsMobActIdList}
                                                        namespace-prefix={namespacePrefix}
                                                        empty-modal-keyword={interactionsMobEmptyModalKeyword}
                                                        is-mobile={displayInteractionsMob}
                                                        record-id={recordId}> <!--Modified by Nikita W.R.To UI Fix-->
                            </c-navatar-acuity-redirection-lwc>
                        </template>
                    </div>
                    <!--End Mobile all interaction-->

                    <!--TAGGED SECTION : START-->
                    <div class="for_desk slds-col slds-size_3-of-12">
                        <div class="slds-p-right_small">
                            <lightning-layout>
                                <lightning-layout-item size="12">
                                    <div class="slds-box slds-theme_shade">
                                        <div style="display: flex; align-items: center">
                                            <span class="slds-page-header__title slds-text-align_left slds-m-left_xx-small fit-width-content"
                                                  title="Tagged">
                                                Tagged
                                            </span>
                                            <lightning-helptext content={infoHelpText}
                                                                class="info cls_helpText"><!--Modified by Anshika Ahuja W.R.To Critical_Bug #00035166, 00035171 Help Text Info Icon 09-02-2023-->
                                            </lightning-helptext>
                                        </div>
                                    </div>
                                </lightning-layout-item>
                            </lightning-layout>
                            <!--Removed "name="radioGroup"" by LK on 2024-05-28 to fix 00045762 ; 00045798 ; 00045815 ; 00045826 ; 00045296 ; 00045304-->
                            <lightning-radio-group options={taggedSecOptions}
                                                   onchange={handleReferenced}
                                                   value={refTabValue}
                                                   type="button"
                                                   class="radioBtns radiofourbtns">
                            </lightning-radio-group>

                            <div class="slds-box slds-box_small slds-p-horizontal_none slds-p-around_none">
                                <!--Start Container-->
                                <div class="slds-grid slds-wrap">
                                    <div class="slds-col slds-size_1-of-1 slds-text-align_left">
                                        <!--Start Company-->
                                        <template if:true={companyData}>
                                            <div class="iconC heightC remove_height">
                                                <template if:true={compRefData}>
                                                    <lightning-datatable key-field="comp"
                                                                         hide-checkbox-column
                                                                         data={compRefData}
                                                                         onrowaction={fetchActInfo}
                                                                         columns={referencedCols}
                                                                         class="companyTable shadowremovedatatable">
                                                    </lightning-datatable>
                                                </template>
                                                <template if:false={compRefData}>
                                                    <lightning-datatable key-field="comp"
                                                                         hide-checkbox-column="true"
                                                                         data={noData}
                                                                         onrowaction={fetchActInfo}
                                                                         columns={referencedCols}
                                                                         class="companyTable no-data-main-tab shadowremovedatatable">
                                                    </lightning-datatable>
                                                    <div class="slds-p-around_x-small">
                                                        {errMsg}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <!--End Company-->

                                        <!--Start People-->
                                        <template if:true={peopleData}>
                                            <div class="iconC heightC remove_height">
                                                <template if:true={peopleRefData}>
                                                    <lightning-datatable key-field="people"
                                                                         hide-checkbox-column
                                                                         data={peopleRefData}
                                                                         onrowaction={fetchActInfo}
                                                                         columns={referencedCols}
                                                                         class="peopleTable shadowremovedatatable">
                                                    </lightning-datatable>
                                                </template>
                                                <template if:false={peopleRefData}>
                                                    <lightning-datatable key-field="people"
                                                                         hide-checkbox-column="true"
                                                                         data={noData}
                                                                         onrowaction={fetchActInfo}
                                                                         columns={referencedCols}
                                                                         class="peopleTable shadowremovedatatable no-data-main-tab">
                                                    </lightning-datatable>
                                                    <div class="slds-p-around_x-small">
                                                        {errMsg}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <!--End People-->

                                        <!--Start Deal-->
                                        <template if:true={dealData}>
                                            <div class="iconC heightC remove_height">
                                                <template if:true={dealsRefData}>
                                                    <lightning-datatable key-field="deals"
                                                                         hide-checkbox-column
                                                                         data={dealsRefData}
                                                                         onrowaction={fetchActInfo}
                                                                         columns={referencedCols}
                                                                         class="dealTable shadowremovedatatable">
                                                    </lightning-datatable>
                                                </template>
                                                <template if:false={dealsRefData}>
                                                    <lightning-datatable class="dealTable shadowremovedatatable no-data-main-tab"
                                                                         hide-checkbox-column="true"
                                                                         key-field="deals"
                                                                         data={noData}
                                                                         columns={referencedCols}
                                                                         onrowaction={fetchActInfo}
                                                                         >
                                                    </lightning-datatable>
                                                    <div class="slds-p-around_x-small">
                                                        {errMsg}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <!--End Deal-->

                                        <!--Start Fund-->
                                        <template if:true={fundData}>
                                            <div class="iconC heightC remove_height">
                                                <template if:true={dealsRefData}>
                                                    <lightning-datatable key-field="funds"
                                                                         hide-checkbox-column
                                                                         data={dealsRefData}
                                                                         onrowaction={fetchActInfo}
                                                                         columns={referencedCols}
                                                                         class="dealTable shadowremovedatatable">
                                                    </lightning-datatable>
                                                </template>
                                                <template if:false={dealsRefData}>
                                                    <lightning-datatable class="dealTable shadowremovedatatable no-data-main-tab"
                                                                         hide-checkbox-column="true"
                                                                         key-field="funds"
                                                                         data={noData}
                                                                         columns={referencedCols}
                                                                         onrowaction={fetchActInfo}>
                                                    </lightning-datatable>
                                                    <div class="slds-p-around_x-small">
                                                        {errMsg}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <!--End Fund-->

                                        <!--Start Themes-->
                                        <template if:true={themeData}>
                                            <div class="iconC heightC remove_height">
                                                <template if:true={themesRefData}>
                                                    <lightning-datatable key-field="themes"
                                                                         hide-checkbox-column
                                                                         data={themesRefData}
                                                                         columns={referencedCols}
                                                                         class="dealTable shadowremovedatatable">
                                                    </lightning-datatable>
                                                </template>
                                                <template if:false={themesRefData}>
                                                    <lightning-datatable class="dealTable shadowremovedatatable no-data-main-tab"
                                                                         hide-checkbox-column="true"
                                                                         key-field="themes"
                                                                         data={noData}
                                                                         columns={referencedCols}
                                                                         onrowaction={fetchActInfo}>
                                                    </lightning-datatable>
                                                    <div class="slds-p-around_x-small">
                                                        {errMsg}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <!--End Themes-->

                                        <!--Start Clips-->
                                        <template if:true={clipData}>
                                            <div class="iconC heightC remove_height">
                                                <template if:true={clipsRefData}>    
                                                    <!--Modified by Anshika Ahuja class W.R.To Bug #00034794-->
                                                    <lightning-datatable key-field="clips"
                                                                         hide-checkbox-column
                                                                         data={clipsRefData}
                                                                         columns={referencedCols}
                                                                         class="clipTable shadowremovedatatable" 
                                                                         onrowaction={fetchActInfo}>
                                                    </lightning-datatable>
                                                </template>
                                                <template if:false={clipsRefData}>
                                                    <!--Modified by Anshika Ahuja class W.R.To Bug #00034794-->
                                                    <lightning-datatable class="clipTable shadowremovedatatable no-data-main-tab"
                                                                         hide-checkbox-column="true"
                                                                         key-field="clips"
                                                                         data={noData}
                                                                         columns={referencedCols}>
                                                    </lightning-datatable>
                                                    <div class="slds-p-around_x-small">
                                                        {errMsg}
                                                    </div>
                                                </template>
                                            </div>
                                        </template>
                                        <!--End Clips-->
                                    </div>
                                </div>
                                <!--End Container-->
                            </div>
                        </div>
                    </div>
                    <!--TAGGED SECTION : END-->

                    <div class="slds-col slds-large-size_9-of-12 slds-small-size_12-of-12">
                        <!--INTERACTIONS SECTION : START-->
                        <div class="slds-p-bottom_none slds-m-bottom_small slds-theme_shade slds-box slds-p-horizontal_none main-Container main-cont for_desk">
                            <div class="slds-grid slds-p-bottom_medium slds-wrap slds-p-horizontal_small slds-theme_shade"
                                 style="align-items:center;height:66px;">
                                <div class="slds-col slds-size_6-of-12">
                                    <div style="display: flex; align-items: center">
                                        <span class="slds-page-header__title slds-text-align_left slds-m-left_xx-small"
                                              title="Interactions">
                                            Interactions
                                        </span>
                                        <!--Added "for_desk" CSS class by LK on 2024-07-26 to fix 00046925-->
                                        <lightning-helptext content="Each interaction represents notes from a meeting with this company or with another company where this company was discussed and tagged to the note. An interaction may also represent an email exchange that was tagged by a user. Click on an interaction to view details. Click View All to see additional interactions."
                                                            class="info for_desk">
                                        </lightning-helptext><!--Modified by Anshika Ahuja W.R.To Help Text Info Icon #00035167, 00035172 09-02-2023-->
                                    </div>
                                </div>
                                <div class="slds-col slds-size_6-of-12 slds-text-align_right">
                                    <lightning-icon icon-name="utility:new_direct_message"
                                                    onclick={callViewpopup}
                                                    alternative-text="Log a Call"
                                                    size="x-small"
                                                    title="Log a Call"
                                                    class="cur_point logcallbtn bg-color-blue">
                                    </lightning-icon>
                                </div>
                            </div>

                            <!--Start Next Preview-->
                            <div class={interactionSecCls}>
                                <!--Start Box-->
                                <template if:true={interactionsPartialInfoArray}>
                                    <template for:each={interactionsPartialInfoArray}
                                              for:item="actInfo">
                                        <div class="slds-col slds-medium-size_3-of-12 slds-large-size_3-of-12 pl_2_150"
                                             key={actInfo.actId}>
                                            <c-navatar-acuity-interaction-tile-lwc act-info={actInfo}
                                                                                   act-date={actInfo.date}
                                                                                   act-type={actInfo.type}
                                                                                   act-icon-name={actInfo.iconName}
                                                                                   button-title={actInfo.buttonTitle}
                                                                                   act-subject={actInfo.subject}
                                                                                   act-id={actInfo.id}
                                                                                   act-detail={actInfo.detail}
                                                                                   act-associates={actInfo.tagsInfo}
                                                                                   is-future-activity={actInfo.isFutureActivity}
                                                                                   record-id={recordId}>
                                            </c-navatar-acuity-interaction-tile-lwc>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={interactionsPartialInfoArray}>
                                    <div class="slds-align_absolute-center">
                                        {errMsg}
                                    </div>
                                </template>
                                <!--End Box-->
                            </div>

                            <div class="slds-col slds-size_1-of-1 slds-theme_shade slds-text-align_right slds-p-around_x-small" style="min-height:39.5px;">
                                <div class="slds-page-header__col-actions">
                                    <template if:true={displayViewAll}>
                                        <a onclick={handleViewAllClick}
                                           target="_blank"
                                           title="View All"
                                           style="width: max-content;display: inline-block;">
                                            View All
                                        </a>
                                    </template>
                                </div>
                            </div>
                        </div>
                        <!--INTERACTIONS SECTION : END-->

                        <div class="slds-grid slds-wrap">
                            <!--FOR ACCOUNT/CONTACT ACUITY : START-->
                            <template if:true={displayAccConAcuityConDealSec}>
                                <!--CONTACTS/CONNECTIONS SECTION : START-->
                                <!--#00038817 - Added by Anshika Ahuja W.R.To handle Custom RTs-->
                                <div class={contactSecCls} style="position: relative">
                                    <div class="slds-col slds-small-size_12-of-12 slds-p-right_x-small_desk"> <!--Update by Anshika Ahuja-->
                                        <div class="slds-m-bottom_xx-small">
                                            <!--Start Header-->
                                            <!--Added "curr-rec-name = {currRecName}" by LK on 2024-05-27 to fix 00037882 ; 00045898 ; 00045899-->
                                            <!--Added "isMobile" parameter by LK on 2024-08-09 to fix 00046350-->
                                            <c-navatar-acuity-contacts-section-lwc 
                                                is-mobile = {isMobile}
                                                rec-id = {recordId}
                                                obj-name = {objectApiName}
                                                contact-table-lable = {contactTableLable}
                                                namespace-prefix = {namespacePrefix}
                                                contact-email = {contactEmail}
                                                act-id-list = {actIdList}
                                                internal-data = {internalData}
                                                con-data = {conData}
                                                con-cols = {conCols}
                                                con-cols-mob = {conColsMob}
                                                internal-table-cols = {internalTableCols}
                                                internal-table-cols-mob = {internalTableColsMob}
                                                is-deal-accessible = {isDealAccessible}
                                                tagged-sec-options = {taggedSecOptions}
                                                is-rg-api-error = {isRgApiError}
                                                is-email-drill-down-enabled = {isEmailDrillDownEnabled}
                                                curr-rec-name = {currRecName}>
                                            </c-navatar-acuity-contacts-section-lwc>
                                            <!--Modified by LK on 2024-04-11 to fix 00044459-->
                                        </div>
                                    </div>
                                </div>
                                <!--CONTACTS/CONNECTIONS SECTION : END-->

                                <!--DEALS SECTION : START-->
                                <!--#00038817 - Added by Anshika Ahuja W.R.To handle Custom RTs-->
                                <template if:false={hideDealSection}>
                                    <div class="slds-col slds-large-size_6-of-12 slds-small-size_12-of-12 slds-p-left_x-small_desk mt_mob">
                                        <div class="slds-m-bottom_xx-small">
                                            <div class="slds-grid slds-wrap slds-box slds-theme_shade slds-p-vertical_xx-small div_deal_css"
                                                style="align-items:center;justify-content: space-between;">
                                                <!-- <div class="slds-col slds-size_5-of-12"> -->
                                                <!--00046038 fixed by raju on 11-06-2024-->
                                                <div class="slds-col slds-size_6-of-12 slds-large-size_5-of-12">
                                                    <div style="display: flex;align-items: center;">
                                                        <!--00045464 fixed by raju on dated 21-05-2024 ; Added "clsHeadingWidth"-->
                                                        <span class="slds-page-header__title slds-text-align_left slds-m-left_xx-small fit-width-content clsHeadingWidth"
                                                            title={dealTitle}>
                                                                {dealTitle}
                                                        </span>
                                                        <!-- Help text changes by Virendra Kumar as part of 00035170,00035201,00035120,00035119,00035121,00035141 -->
                                                        <!--Added "for_desk" CSS class by LK on 2024-07-26 to fix 00046925-->
                                                        <lightning-helptext content={helpTextForDealSection} class="info for_desk"></lightning-helptext>
                                                    </div>
                                                    <!--FIRM ACUITY (PRIVATE EQUITY) : DEAL SECTION SORT BY : START-->
                                                    <template if:true={isFirmPE}>
                                                        <ul class="for_desk slds-list_horizontal slds-has-block-links_space slds-m-left_xx-small"
                                                            style="align-items:center;height: 22px;">
                                                            <!-- <template if:true={showHideRemoveIcon}> -->    <!-- 00035328 - Fix By Kushal - 17-02-23 -->
                                                                <li class="sortby_css">
                                                                    <span style="font-size:12px;white-space: nowrap;">
                                                                        Sorted by
                                                                    </span>
                                                                    <lightning-combobox class="sortedbycss"
                                                                                        name="progress"
                                                                                        value={fieldNameForSortPe}
                                                                                        placeholder={placeholderValue}
                                                                                        options={optionsforsortingPE}
                                                                                        onchange={handleChangeSorting}
                                                                                        dropdown-alignment="top-right">
                                                                    </lightning-combobox>
                                                                </li>
                                                            <!-- </template> -->    <!-- 00035328 - Fix By Kushal - 17-02-23 -->
                                                        </ul>
                                                    </template>
                                                    <!--FIRM ACUITY (PRIVATE EQUITY) : DEAL SECTION SORT BY : END-->
                                                    
                                                    <!--FIRM ACUITY : DEAL SECTION SORT BY : START-->
                                                    <template if:true={displayDealSecSort}>
                                                        <ul class="for_desk slds-list_horizontal slds-has-block-links_space slds-m-left_xx-small"
                                                            style="align-items:center;height: 22px;">
                                                            <li class="sortby_css">
                                                                <span style="font-size:12px;white-space: nowrap;">
                                                                    Sorted by
                                                                </span>
                                                                <template if:true={isInstitution}>
                                                                    <lightning-combobox class="sortedbycss"
                                                                                        name="progress"
                                                                                        value={dealSecSortValue}
                                                                                        placeholder={prevDealSecSortValue}
                                                                                        options={dealSecSortOptnsForFundraising}
                                                                                        onchange={handleDealSecValueChange}
                                                                                        dropdown-alignment="topright">
                                                                    </lightning-combobox>
                                                                </template>
                                                                <template if:false={isInstitution}>
                                                                <lightning-combobox class="sortedbycss"
                                                                                    name="progress"
                                                                                    value={dealSecSortValue}
                                                                                    placeholder={prevDealSecSortValue}
                                                                                    options={dealSecSortOptns}
                                                                                    onchange={handleDealSecValueChange}
                                                                                    dropdown-alignment="topright">
                                                                </lightning-combobox>
                                                                </template>
                                                            </li>
                                                        </ul>
                                                    </template>
                                                    <!--FIRM ACUITY : DEAL SECTION SORT BY : END-->
                                                </div>
                                                <template if:true={displayDealSecToggle}>
                                                    <!-- <div class="slds-col slds-large_6-of-12 slds-small_8-of-12  slds-text-align_left"> -->
                                                    <!--00046038 fixed by raju on 11-06-2024-->
                                                    <div class="slds-col slds-size_6-of-12 slds-large-size_6-of-12  slds-text-align_left">
                                                        <!--Removed "name="radioGroupss"" by LK on 2024-05-28 to fix 00045762 ; 00045798 ; 00045815 ; 00045826 ; 00045296 ; 00045304-->
                                                        <lightning-radio-group options={optnsFundCoInv}
                                                                            onchange={handleDealSecTabSwitch}
                                                                            value={dealSecTabValue}
                                                                            type="button"
                                                                            class="radioBtnsInterExterFund">
                                                        </lightning-radio-group>
                                                    </div>
                                                    <ul class="for_desk slds-list_horizontal slds-has-block-links_space"
                                                        style="align-items:center;justify-content:end">
                                                        <!--Added "template if:true" by LK on 2024-06-21 to fix 00046176-->
                                                        <template if:true={displayNewFdrPlusIcon}>
                                                            <li>
                                                                <lightning-icon icon-name="utility:new"
                                                                                size="x-small"
                                                                                alternative-text="New Fundraising"
                                                                                title="New Fundraising"
                                                                                onclick={handleNewFdr}
                                                                                class="cur_point addMinus">
                                                                </lightning-icon>
                                                            </li>
                                                        </template>
                                                        <template if:true={displayNewFdrCon}>
                                                            <li>
                                                                <lightning-icon icon-name="utility:adduser"
                                                                                size="x-small"
                                                                                alternative-text="New Fundraising Contact"
                                                                                onclick={handleFundraisingContactCreate}
                                                                                title="New Fundraising Contact"
                                                                                class="for_desk cur_point addMinus slds-m-right_x-small">
                                                                </lightning-icon>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </template>
                                                <template if:true={displayDealPlusIcon}>
                                                    <ul class="for_desk slds-list_horizontal slds-has-block-links_space"
                                                        style="align-items:center;justify-content:end">
                                                        <li>
                                                            <lightning-icon icon-name="utility:new"
                                                                            size="x-small"
                                                                            alternative-text={dealPlusIconText}
                                                                            title={dealPlusIconText}
                                                                            onclick={handleNewDealAction}
                                                                            class="cur_point addMinus slds-m-right_x-small">
                                                            </lightning-icon>
                                                        </li>
                                                        <template if:true={displayAddDealTeamMember}>
                                                            <li>
                                                                <lightning-icon icon-name="utility:adduser"
                                                                                size="x-small"
                                                                                alternative-text="New Deal Contact"
                                                                                title="New Deal Contact"
                                                                                onclick={handleNewDealTeamMemberAction}
                                                                                class="cur_point addMinus">
                                                                </lightning-icon>
                                                            </li>
                                                        </template>
                                                    </ul>
                                                </template>
                                                <!--For Firm (PE) Acuity > Deals Section : Start-->
                                                <template if:true={displayPEDealSecToggle}>
                                                    <!--Moved existing code inside div for 00045497 by raju on dated 27-05-2024-->
                                                    <div class="clsViewDsktop">
                                                        <div class="slds-col slds-large_5-of-12 slds-small_9-of-12 slds-text-align_center">
                                                            <!--Removed "name="radioGroups"" by LK on 2024-05-28 to fix 00045762 ; 00045798 ; 00045815 ; 00045826 ; 00045296 ; 00045304-->
                                                            <lightning-radio-group options={optionPEDeals}
                                                                                   onchange={handleReferencedinterexter}
                                                                                   value={peTabValue}
                                                                                   variant="label-hidden"
                                                                                   type="button"
                                                                                   class="radioBtnsInterExterFund mr_vertical">
                                                            </lightning-radio-group>
                                                        </div>
                                                        <div class="slds-col slds-size_2-of-12  addMinus">
                                                            <template if:true={isFundTabPopup}>
                                                                <ul class="for_desk">
                                                                    <li>
                                                                        <lightning-icon icon-name="utility:new"
                                                                                        size="x-small"
                                                                                        alternative-text="New Deal"
                                                                                        title="New Deal"
                                                                                        onclick={handleNewDeal_PrivateEquity}
                                                                                        class="cur_point slds-float_right addMinus">
                                                                        </lightning-icon>
                                                                    </li>
                                                                </ul>
                                                            </template>
                                                            <template if:true={isSourcedTabPopup}>
                                                                <ul class="for_desk slds-list_horizontal slds-has-block-links_space"
                                                                    style="align-items:center;justify-content:end">
                                                                    <li>

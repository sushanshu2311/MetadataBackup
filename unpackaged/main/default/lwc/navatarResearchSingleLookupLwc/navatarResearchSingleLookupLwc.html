<template>
    <div class="pill_div">
        <div class="slds-form-element">
            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div id="box" class={boxClass} aria-expanded="true" aria-haspopup="listbox" role="combobox">
                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                            <label class="slds-form-element__label" for="unique-id-of-input">{fieldLabelName}</label>
                            <template if:true={isValueSelected}>
                                <div id="lookup-pill" class="slds-pill-container slds-input d_flex pill_div">
                                    <lightning-pill class="pillSize d_flex pillwidth" label={selectedName} name={selectedName} onremove={handleRemovePill}>
                                        <lightning-icon icon-name={iconName} alternative-text={objName} ></lightning-icon>
                                    </lightning-pill>
                                </div>
                            </template>
                            <template if:false={isValueSelected}>
                                <div class="slds-p-top_none">
                                    <lightning-input class={inputClass} type="text" id="input" value={searchTerm}
                                                     onclick={handleClick} onblur={onBlur} onchange={onChange}
                                                     variant="label-hidden" autocomplete="off" placeholder={searchPlaceholder} message-when-bad-input="Complete this field">
                                    </lightning-input>
                                     <span class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right"
                                            title="Enter the Record Name">
                                            <lightning-icon icon-name="utility:search"
                                                            size="x-small"
                                                            alternative-text="search!"
                                                            title="Search">
                                            </lightning-icon>
                                    </span>
                                </div>
                            </template>
                        </div>

                            <template if:true={isRecordsFound}>
                            <ul data-id="showLookupRecordDataId" class="drop_ul">
                                <template for:each={records} for:item="record">
                                    <div key={record.Id} class="slds-p-around_x-small dropLists" onclick={onSelect} data-id={record.Id} data-name={record.Name}>
                                        <lightning-icon  icon-name={iconName} size="small" alternative-text={objName}></lightning-icon>
                                        <li class="slds-nav-vertical__item " role="listitem">{record.Name}</li>
                                    </div>

                                  
                                </template>
                            </ul>
                            </template>
                            <!-- <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={records} for:item="record">
                                    <li key={record.Id} onclick={onSelect} data-id={record.Id} role="presentation" data-name={record.Name}>
                                        <span class="slds-lookup__item-action slds-lookup__item-action--label" role="option">
                                            <lightning-icon class="slds-icon slds-icon--small slds-icon-text-default" icon-name={iconName} alternative-text={objName} size="small"></lightning-icon>
                                            <span class="slds-truncate">{record.Name}</span>
                                        </span>
                                    </li>
                                </template>
                            </ul> -->
                    </div>
                </div>
            </div>
        </div>
    </div>
</template>

<template>

    <div style="display:flex;flex-direction:column;height:100%;min-height:420px;">

        <!-- DEFAULT VIEW: suggested questions (no context yet) -->
        <template if:false={hasContext}>
            <template if:true={promptsExpanded}>
                <div style="flex-shrink:0;display:flex;justify-content:flex-end;padding:6px 12px;">
                    <button class="sq-close-btn" onclick={handleCloseDefaultView}>&#x2715; Close</button>
                </div>
            </template>
            <div style="flex:1;overflow-y:auto;">
                <template for:each={suggestedQuestions} for:item="q">
                    <div key={q.id} class="sq-row" data-text={q.text} onclick={handleSuggestionClick}>
                        <a href="#" class="sq-link" data-text={q.text} onclick={handleSuggestionClick}>{q.text}</a>
                    </div>
                </template>
            </div>
        </template>

        <!-- CONTEXT VIEW: selected item + recommended actions + chat -->
        <template if:true={hasContext}>

            <!-- Context title banner (only when opened from feed item) -->
            <template if:true={showActions}>
                <div class="ctx-title-wrap">
                    <p class="ctx-title">{selectedContext}</p>
                </div>
            </template>

            <!-- Body (scrollable) -->
            <div style="flex:1;overflow-y:auto;padding:12px 16px;">

                <!-- Action buttons (only when opened from feed item) -->
                <template if:true={showActions}>
                    <template for:each={computedRecommendedActions} for:item="action">
                        <div key={action.id}
                            class={action.btnClass}
                            data-text={action.text}
                            onclick={handleActionClick}>
                            {action.text}
                        </div>
                    </template>
                </template>

                <!-- Chat messages -->
                <template if:true={hasMessages}>
                    <ul class="slds-chat-list slds-m-top_medium">
                        <template for:each={messages} for:item="msg">
                            <li key={msg.id} class={msg.listClass}>
                                <div class="slds-chat-message">
                                    <div class="slds-chat-message__body">
                                        <div class={msg.bubbleClass}>
                                            <p class="slds-text-body_small">{msg.text}</p>
                                        </div>
                                        <p class="slds-chat-message__meta">{msg.timestamp}</p>
                                    </div>
                                </div>
                            </li>
                        </template>
                    </ul>
                    <template if:true={isTyping}>
                        <p class="slds-text-body_small slds-text-color_weak slds-m-top_x-small">Navatar Intelligence is thinking...</p>
                    </template>
                </template>

            </div>

            <!-- Prompts toggle — fixed above footer -->
            <div class="prompts-toggle-bar">
                <a href="#" class="prompts-link" onclick={handleTogglePrompts}>
                    <span class="prompts-icon">⚡</span>
                    <span class="prompts-label"> Prompts</span>
                </a>
            </div>

        </template>

        <!-- Footer: always visible -->
        <div style="flex-shrink:0;position:relative;">
            <!-- Settings dropdown -->
            <template if:true={settingsOpen}>
                <div class="settings-backdrop" onclick={handleToggleSettings}></div>
                <div class="settings-dropdown">
                    <template for:each={settingsOptions} for:item="opt">
                        <div key={opt.value} class={opt.rowClass} data-value={opt.value} onclick={handleSettingsSelect}>
                            {opt.label}
                        </div>
                    </template>
                </div>
            </template>

            <div class="slds-p-around_small slds-border_top">
                <lightning-layout vertical-align="center">
                    <lightning-layout-item flexibility="auto" class="slds-m-right_x-small">
                        <input
                            type="text"
                            class="ai-input"
                            placeholder="Ask anything about this record..."
                            value={inputText}
                            oninput={handleInput}
                            onkeydown={handleKeyDown} />
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="no-flex" class="slds-m-right_x-small">
                        <button class="gear-btn" title="Settings" onclick={handleToggleSettings}>⚙</button>
                    </lightning-layout-item>
                    <lightning-layout-item flexibility="no-flex">
                        <lightning-button label="Send" variant="brand" onclick={handleSend}></lightning-button>
                    </lightning-layout-item>
                </lightning-layout>
            </div>
        </div>

    </div>

</template>

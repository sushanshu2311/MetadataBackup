<template>
    <div class="main-Container">
        <!-- Bug 00045783 fixed by Deepak -->
        <template if:true={isInfoMessage}>
            <template if:true={isFromSdg}>
            <div class="ClsOutreMessageBox">
                <div class="slds-text-heading_small">Please close the Browser Tab to exit the page</div>
            </div>
        </template>
        </template>
        <!--  // UI fix critical 00038073 1 march textarea only for UI  -->
        <textarea class="slds-textarea txtar" style="visibility: hidden;max-height:50px;position:absolute;z-index:-10;width: 39%;max-width: 39%;left: 30%;margin: auto;"></textarea>
        <!-- UI fix critical 00038269 4march width: 39%;max-width: 39%;left: 30%;margin: auto; -->
        <!--  // UI fix critical 00038073 1 march textarea only for UI  -->
        <template if:false={isEditAccess}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open" style="z-index:15003">
                <div class="slds-modal__container">
                    <!-- modal header start -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={hideRecordModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                                size="small" title="Close"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 class="slds-text-heading_medium slds-hyphenate">Note</h2>
                    </header>

                    <!-- modal body start -->
                    <div class="slds-modal__content slds-p-around_small">
                        <div class="slds-form-element__control slds-m-horizontal_medium slds-grow ">
                            You do not have the level of access necessary to perform the operation you requested. Please
                            contact the owner of the record or your administrator if access is necessary.
                        </div>
                    </div>

                    <!-- modal footer start-->
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={hideRecordModal}
                            title="Close">Close</button>
                    </footer>

                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open" style="z-index:15002;"></div>
        </template>


        <template if:true={isShowModal}>
        	<!-- Fixed by Sudhanshu for 47983 -->
            <section role="dialog" tabindex="-1" aria-modal="true" class="slds-modal slds-fade-in-open customize slds-modal_large"
                style="z-index:15002">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
                </template>
                <div class="slds-modal__container">
                    <!-- UI changes - 04-10-2022 removed width-->
                    <!-- modal header start -->
                     <!-- Bug 00047557 Fixed by Sudhanshu -->
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close this window" onclick={hideRecordModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close this window" variant="inverse"
                                size="small" title="Close this window">
                            </lightning-icon>
                            <span class="slds-assistive-text">close this window</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate header_text">
                            <lightning-icon icon-name={headerIcon} size="small" alternative-text="events"
                                title={modalHeader}></lightning-icon>{modalHeader}
                        </h2>
                        <template if:true={expandIcon}>
                            <!-- Bug 00043332 Fixed by Sudhanshu 24-04-2024  -->
                            <lightning-icon icon-name="utility:expand" size="x-small" alternative-text="event"
                                title="Expand"
                                style="float: right;position: absolute;right: 15px;top: 17px;cursor:pointer;"
                                onclick={expandPopup}></lightning-icon>
                        </template>
                        <template if:false={expandIcon}>
                            <lightning-icon icon-name="utility:contract_alt" size="x-small" alternative-text="contract"
                                title="Contract"
                                style="float: right;position: absolute;right: 15px;top: 17px;cursor:pointer;"
                                onclick={expandPopup}></lightning-icon>
                        </template>
                    </header>

                    <!-- modal body start -->
                    <div class="slds-modal__content ">

                        <template if:true={isError}>
                            <div class="slds-p-horizontal_large slds-p-top_medium slds-p-bottom_medium">
                                <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                                    <span class="slds-assistive-text">error</span>
                                    <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small"
                                        title="Description of icon when needed">
                                    </span>
                                    <h2>Review the errors on this page.</h2>
                                </div>
                                <template for:each={errorMessage} for:item="err">
                                    <p class="slds-p-left_medium" key={err} style="color:red">{err} </p>
                                </template>
                        
                            </div>
                        </template>
                        <div
                            class="slds-form-element slds-p-horizontal_medium slds-m-horizontal_medium slds-m-top_small">
                            <label class="slds-form-element__label">{subjectLabel}</label>
                            <div class="slds-form-element__control">
                                <div class="slds-combobox_container">
                                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                                        <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                            role="none">
                                            <input type="text" value={subject} onkeyup={handleChangeSubject}
                                                onclick={showSubjectOption} onblur={hideSubjectOption}
                                                class="slds-input slds-combobox__input" data-id="combobox-id-1"
                                                aria-autocomplete="list" aria-controls="listbox-id-1" 
                                                aria-expanded="false" aria-haspopup="listbox" role="combobox" />
                                            <span
                                                class="slds-icon_container slds-icon-utility-search slds-input__icon slds-input__icon_right">
                                                <lightning-icon icon-name="utility:search" size="x-small"
                                                    title="Warning">
                                                </lightning-icon>
                                            </span>
                                        </div>
                                        <template if:true={showSubjectError}><span class="errorMsg">Complete this
                                                field</span></template>
                                        <div data-id="listbox-id-1"
                                            class="slds-dropdown slds-dropdown_length-with-icon-7 slds-dropdown_fluid"
                                            role="listbox" onclick={hideDropDown}>
                                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                                <template for:each={subjectOptions} for:item="record">
                                                    <li role="presentation" class="slds-listbox__item"
                                                        key={record.value} onclick={selectSubject}
                                                        data-id={record.value} data-name={record.value}>
                                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                                            role="option">
                                                            <span class="slds-media__body">
                                                                <span
                                                                    class="slds-listbox__option-text slds-listbox__option-text_entity"
                                                                    onclick={selectSubject}>{record.label}</span>
                                                            </span>
                                                        </div>
                                                    </li>

                                                </template>

                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>


                        <div style="position:relative ;margin: 0 31px 0 0px;" class="slds-form-element slds-p-horizontal_medium slds-m-horizontal_medium slds-m-top_small">
                            <!--<lightning-input-rich-text value={commentStr} onchange={handleChangeRich}
                                    class="slds-m-horizontal_medium" label="Notes" label-visible="true"
                                    disabled-categories="FORMAT_FONT, FORMAT_TEXT, FORMAT_BODY, ALIGN_TEXT, INSERT_CONTENT, REMOVE_FORMATTING">
                                </lightning-input-rich-text>-->
                            <!-- <lightning-input-rich-text onchange={handleChangeNotes} value={commentStr} class="slds-m-horizontal_medium texthelp" label="Notes" label-visible="true"
                        disabled-categories="FORMAT_FONT, FORMAT_TEXT, FORMAT_BODY, ALIGN_TEXT, INSERT_CONTENT, REMOVE_FORMATTING"></lightning-input-rich-text> -->
                            <label class="slds-form-element__label slds-m-horizontal_medium">Notes</label>
                            <div>
                                <!-- <textarea onchange={handleChangeNotes} onkeyup={test} oninput={test1}
                                    class="slds-m-horizontal_medium texthelp notetextareaEdit" 
                                    style="width: 100%;height: 282px;border-color: #c3c3c3;border-radius: 4px;resize:none;outline:0;">{commentStr}</textarea>Bug #00038272UI Bug #38418 changed height from 200px to 282px
                                    UI fix critical 00038269 4march resize:none;outline:0; 
                                    Rich Textarea fixed
                                    -->

                                    <template if:false={isRichTxtEnable}>
                                        <textarea onchange={handleChangeNotes} onkeyup={test} oninput={test1}
                                        class="slds-m-horizontal_medium texthelp notetextareaEdit" formats={formats}
                                        style="width: 100%;height: 282px;border-color: #c3c3c3;border-radius: 4px;resize:none;outline:0;">{commentStr}</textarea>
                                      </template> 
    
                                        <template if:true={isRichTxtEnable}>
                                            <!-- 00047283 - Fixed by Deepak Rich Text issue -->
                                            <!-- Fixed by Sudhanshu for 47978 -->
                                            <lightning-input-rich-text onchange={handleChangeNotes} onkeyup={test} oninput={test1}
                                            share-with-entity-id
                                            class="slds-m-horizontal_medium texthelp notetextareaEdit richTextCls" formats={formats}
                                            style="width: 100%;height: auto;border-color: #c3c3c3;border-radius: 4px;resize:none;outline:0;" value={richTxtDescription}></lightning-input-rich-text><!--Bug #00038272--><!-- UI Bug #38418 changed height from 200px to 282px-->
                                        </template>
                                        
                            </div>

                            <div class="hover">
                                <template for:each={recordData} for:item="obj">
                                    <li key={obj.Id} role="presentation" class="slds-listbox__item">
                                        <!-- Fixed by Raju for 47979 -->
                                        <div data-recid={obj.Id} onclick={handelSelectedRecord}
                                            class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta clsSldsMedia"
                                            role="option" title={obj.Name}>
                                            <span style="pointer-events: none;"
                                                class="slds-media__figure slds-listbox__option-icon">
                                                <span class="slds-icon_container">
                                                    <lightning-icon icon-name={obj.iconName} size="small"
                                                        alternative-text="icon" class="suggest-css"> </lightning-icon>
                                                </span>
                                            </span>
                                            <span style="pointer-events: none;" class="slds-media__body">
                                                <!-- Added By Sudhanshu for CR(00047979) Change -->
                                                <span
                                                    class="slds-listbox__option-text slds-listbox__option-text_entity">{obj.Name}<br /><span class="clsFontSize"><template if:true={obj.isContact}>{obj.actName}</template></span></span>
                                            </span>
                                        </div>
                                    </li>
                                </template>
                            </div>
                        </div>

                        <lightning-layout>
                            <lightning-layout-item class="slds-m-top_xx-small slds-p-left_medium">
                                <lightning-icon icon-name="standard:quotes"
                                    class="topic2 cur_point pillClass slds-m-left_medium slds-m-right_xx-small mt15"
                                    variant="brand" size="small" onclick={handleClickTag} alternative-text="Tag"
                                    title="Tag">
                                </lightning-icon>
                            </lightning-layout-item>
                            <lightning-layout-item class="mt_1">
                                <!-- Sudhanshu Changes For Attachment -->
                                <!-- <div class="image-upload slds-p-around_x-small"> -->
                                    <!-- <label for="file-input">
                                        <lightning-icon icon-name="standard:attach"
                                            class="slds-m-top_small topic2 cur_point pillClass cur_pointer"
                                            variant="brand" size="small" title="Attachment">
                                           
                                        </lightning-icon>
                                    </label> -->
                                    <!-- <lightning-input type="file" variant="label-hidden"
                                                     accept=".xlsx, .xls, .csv, .png, .doc, .docx, .pdf"
                                                     label="Attachment" onchange={openfileUpload}></lightning-input>
                                    <input id="file-input" type="file" onchange = {openfileUpload}/> -->
                                    <!-- <lightning-file-upload
                                    class="slds-m-top_small topic2 cur_point pillClass cur_pointer"
                                    name="fileUploader"
                                    accept={acceptedFormats}
                                    record-id={recordId}
                                    onuploadfinished={handleUploadFinished} multiple>
                            </lightning-file-upload> -->
                        <!-- </div> -->
                            <template if:true={isRichTxtEnable}>
                                <!-- Added By Sudhanshu for CR Change ; 49797 -->
                                <lightning-input type="toggle" label="" title={rtaToggleHoverText}  name="input2" checked={rtaToggleStatus} onchange={handleNotes} class="slds-float_right clsToggleIconPos"></lightning-input>
                            </template>   
                                

                                <!-- Sudhanshu Changes End Here -->
                            </lightning-layout-item>
                        </lightning-layout>

                        <lightning-layout>
                            <lightning-layout-item size="12" class="slds-p-horizontal_medium mt_1 lookup_css_h">
                                <div if:true={isTagOpen} class="slds-p-horizontal_medium">
                                    <c-navatar-combobox-polymorphic-lwc obj-name={searchObjects}
                                        onlookupselected={handleSelectLookup}
                                        search-placeholder="Search"></c-navatar-combobox-polymorphic-lwc> <!--Placeholder change Critical Bug fix nikita S-->
                                </div>
                            </lightning-layout-item>
                        </lightning-layout>

                        <div class="slds-grid slds-m-top_xx-small slds-m-horizontal_medium">
                            <div class="slds-size_12-of-12 slds-p-horizontal_medium">
                                <template for:each={allTaggedRecords} for:item="obj">
                                    <template if:true={obj.isUser}>
                                            <lightning-pill label={obj.Name} key={obj.Id} name={obj.Id}
                                                data-id={obj.Name} variant="plain"
                                                class="pillClass slds-m-right_xx-small pillsHide">
                                            <lightning-icon icon-name={obj.iconName}
                                                alternative-text={obj.objectName}></lightning-icon>
                                        </lightning-pill>
                                    </template>
                                    <template if:false={obj.isUser}>
                                            <lightning-pill label={obj.Name} key={obj.Id} name={obj.Id}
                                                data-id={obj.Name} class="pillClass slds-m-right_xx-small"
                                                onremove={removeRecord}>
                                            <lightning-icon icon-name={obj.iconName}
                                                alternative-text={obj.objectName}></lightning-icon>
                                        </lightning-pill>
                                    </template>
                                </template>
                            </div>
                        </div>


                        <div class="slds-grid slds-p-horizontal_medium mainContainer label_hide_css lookup_css_h">
                            <div class="slds-size_1-of-1">
                                <!-- CR Changes(00047980) Done by Sudhanshu -->
                                <lightning-accordion class="example-accordion advanceAccordion" active-section-name={activeSectionAdvance}
                                    allow-multiple-sections-open >
                                    <lightning-accordion-section name="A" label="Advanced"
                                        class="advance-font cls_leftSpace">
                                        
                                        
                                        <lightning-layout class="slds-p-horizontal_large">
                                            <lightning-layout-item size="12" flexibility="auto" class="slds-p-right_small">
                                                <!--  Bug 00045923 Fixed by Sudhanshu on 24-05-2024 -->
                                                <div class="outerDiv">      
                                                    <template for:each={otherFields} for:item="field">
                                                    <div class="innerDiv" key={field.fieldType}>
                                                        <div key={field.fieldType} class="slds-m-top_medium" style="min-height: 60px;">
                                                            <template if:true={field.isText}>
                                                                <lightning-input type="text" class={field.fieldAPI}
                                                                    label={field.fieldLabel} id={field.fieldAPI}
                                                                    required={field.isRequired}
                                                                    value={field.fieldValue} maxlength="255"></lightning-input>
                                                                    <!-- Bug 00045513 Fixed by Sudhanshu on 14-05-2024  -->
                                                            </template>
                                                            <template if:true={field.isTextArea}>
                                                                <lightning-textarea
                                                                    label={field.fieldLabel} label-visible="true" class={field.fieldAPI} id={field.fieldAPI}
                                                                    value={field.fieldValue} onchange={handleChange} required={field.isRequired} maxlength="255" >
                                                                </lightning-textarea>
                                                                <!-- Bug 00045513 Fixed by Sudhanshu on 14-05-2024  -->
                                                            </template>
                                                            <template if:true={field.isBoolean}>
                                                                 <!-- Bug 00046272 fixed by sudhanshu on 02-07-2024 -->
                                                                <label class="slds-form-element__label">{field.fieldLabel}</label>
                                                                <lightning-input type="checkbox"
                                                                    data-name={field.fieldAPI} onchange={handleAllDayEvent} variant="label-hidden"  class={field.fieldAPI}
                                                                    label={field.fieldLabel} id={field.fieldAPI}
                                                                    checked={field.booleanValue}></lightning-input>

                                                                    <!-- <div class="slds-form-element">
                                                                        <label class="slds-form-element__label">{field.fieldLabel}</label>
                                                                        <div class="slds-form-element__control">
                                                                          <span class="slds-checkbox slds-checkbox_standalone">
                                                                            <input type="checkbox"
                                                                            data-name={field.fieldAPI} class={field.fieldAPI} required={field.isRequired}
                                                                             id={field.fieldAPI}
                                                                            checked={field.booleanValue} />
                                                                            <span class="slds-checkbox_faux"></span>
                                                                          </span>
                                                                        </div>
                                                                    </div> -->
                                                            </template>

                                                            <template if:true={field.isDate}>
                                                                <lightning-input type="date" data-name={field.fieldAPI}
                                                                    onchange={handleChangeEventDate}
                                                                    required={field.isRequired}
                                                                    message-when-bad-input="Invalid data type"
                                                                    class={field.fieldAPI} label={field.fieldLabel}
                                                                    id={field.fieldAPI} value={field.dateValue}>
                                                                </lightning-input>
                                                            </template>

                                                            <template if:true={field.isDateTime}>
                                                                <lightning-input type="datetime"
                                                                    required={field.isRequired}
                                                                    onchange={handleChangeDate}
                                                                    message-when-bad-input="Invalid data type"
                                                                    data-name={field.fieldAPI} class={field.fieldAPI}
                                                                    label={field.fieldLabel} id={field.fieldAPI}
                                                                    value={field.dateTimeValue} onclick={tobottom}>
                                                                </lightning-input>
                                                            </template>

                                                            <template if:true={field.isPicklist}>
                                                                <c-navatar-picklist-lwc field-name={field.fieldAPI}
                                                                    object-name={objectName}
                                                                    field-label-name={field.fieldLabel}
                                                                    selected-option={field.fieldValue}
                                                                    input-cls={field.fieldAPI}
                                                                    class-name={field.lwcFieldClass}
                                                                    is-required={field.isRequired}>
                                                                </c-navatar-picklist-lwc>
                                                            </template>

                                                            
                                                                <template if:true={field.isReference}>
                                                                    <c-navatar-single-lookup-lwc
                                                                        obj-name={field.referenceObjName}
                                                                        field-name={field.fieldAPI}
                                                                        field-label-name={field.fieldLabel}
                                                                        selected-id={field.fieldValue}
                                                                        input-cls={field.fieldAPI}
                                                                        is-required={field.isRequired}>
                                                                    </c-navatar-single-lookup-lwc>
                                                                </template>
                                                            

                                                            <template if:true={field.isNumber}>
                                                                <lightning-input type="number" class={field.fieldAPI}
                                                                    label={field.fieldLabel} id={field.fieldAPI} required={field.isRequired}
                                                                    value={field.numberValue} step="0.01">
                                                                </lightning-input>
                                                            </template>
                                                            <template if:true={field.isPhone}>
                                                                <lightning-input type="text" class={field.fieldAPI}
                                                                    label={field.fieldLabel} id={field.fieldAPI}
                                                                    value={field.fieldValue} required={field.isRequired} >
                                                                </lightning-input>
                                                            </template>
                                                            <template if:true={field.isEmail}>
                                                                <lightning-input type="text" class={field.fieldAPI}
                                                                    label={field.fieldLabel} id={field.fieldAPI}
                                                                    value={field.fieldValue} required={field.isRequired}></lightning-input>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    </template>
                                                </div>
                                            </lightning-layout-item>
                                        </lightning-layout>

                                        <lightning-accordion allow-multiple-sections-open
                                            onsectiontoggle={handleClickFollowupTask}
                                            class="slds-p-horizontal_x-small slds-p-vertical_none">
                                            <lightning-accordion-section name="B" label="Tasks"
                                                class="slds-p-around_none">
                                                <template for:each={followUpList} for:item="raw">
                                                    <div class="slds-box slds-theme_shade slds-m-top_x-small"
                                                        key={raw.id}>
                                                        <!-- 00031214 hide close button if there is only one task -->
                                                        <template if:true={followupTaskList}>
                                                            <div class="slds-grid">
                                                                <div class="slds-size_1-of-1">
                                                                    <div class="slds-clearfix">
                                                                        <div class="slds-float_right">
                                                                            <lightning-icon icon-name="utility:close"
                                                                                class="cur_point slds-m-right_xx-small slds-floar_right"
                                                                                size="x-small" alternative-text=""
                                                                                title="Close" onclick={closeMoreTask}
                                                                                data-id={raw.id}>{raw.id}
                                                                            </lightning-icon>
                                                                        </div>
                                                                    </div>
                                                                </div>
                                                            </div>
                                                        </template>


                                                        <div class="slds-grid">
                                                            <div class="slds-size_1-of-1" role="listitem">
                                                                <div class="slds-m-horizontal_x-small">
                                                                    <!--  Bug 00045923 Fixed by Sudhanshu on 24-05-2024 -->
                                                                    <div class="outerDiv">
                                                                    <template for:each={raw.data} for:item="field">
                                                                        <!-- <template if:true={field.isLeftField}> -->
                                                                            <div key={field.fieldType}
                                                                                class="slds-m-top_small innerDiv" style="min-height: 60px">
                                                                                <!-- <div class="innerDiv"> -->
                                                                                <template if:true={field.isText}>
                                                                                    <lightning-input type="text"
                                                                                        class={field.lwcFieldClass}
                                                                                        label={field.fieldLabel}
                                                                                        id={field.fieldAPI}
                                                                                        required={field.isRequired}
                                                                                        value={field.fieldValue}
                                                                                        maxlength="255">
                                                                                    </lightning-input>
                                                                                    <!-- Bug 00045513 Fixed by Sudhanshu on 14-05-2024  -->
                                                                                </template>
                                                                                <template if:true={field.isTextArea}>
                                                                                    <lightning-textarea
                                                                                        label={field.fieldLabel} label-visible="true" class={field.lwcFieldClass} id={field.fieldAPI}
                                                                                        value={field.fieldValue}  onchange={handleChange} required={field.isRequired} maxlength="255">
                                                                                     </lightning-textarea>
                                                                                     <!-- Bug 00045513 Fixed by Sudhanshu on 14-05-2024  -->
                                                                                </template>


                                                                                <template if:true={field.isCombobox}>
                                                                                    <label
                                                                                        class="slds-form-element__label"
                                                                                        for="combobox-id-1">{subjectLabel}</label>
                                                                                    <div
                                                                                        class="slds-form-element__control">
                                                                                        <div
                                                                                            class="slds-combobox_container">
                                                                                            <div
                                                                                                class={raw.subjectClass}>
                                                                                                <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right"
                                                                                                    role="none">

                                                                                                    <input type="text"
                                                                                                        value={field.fieldValue}
                                                                                                        class="slds-input slds-combobox__input"
                                                                                                        aria-autocomplete="list"
                                                                                                        aria-controls="listbox-id-1"
                                                                                                        aria-expanded="false"
                                                                                                        aria-haspopup="listbox"
                                                                                                        onkeyup={handleChangeSubjectFollowUp}
                                                                                                        onclick={showSubjectOptionFollowUp}
                                                                                                        onblur={hideSubjectOption}
                                                                                                        role="combobox"
                                                                                                        placeholder="Subject"
                                                                                                        data-id={field.lwcFieldClass}
                                                                                                        required={field.isRequired}
                                                                                                        data-uid={raw.subjectClass} />

                                                                                                    <span

                                    </c-navatar-single-lookup-lwc>
                                </template>
                                <template if:true={quickCreateRecord.showAccountRecType}>
                                    <lightning-combobox id={quickCreateRecord.index} variant="label-hidden"
                                        name="progress" label="Record Type" dropdown-alignment="auto" value={quickCreateRecord.accountRecType} placeholder="Select Account Record Type" options={actOptions}
                                        data-id={quickCreateRecord.index} onchange={handleRecTypeChange}>
                                    </lightning-combobox>
                                </template>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>
                </template>


            </div>
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" aria-label="Ignore" title="Ignore"
                    onclick={handleDealTeam}>Ignore</button>
                <button class="slds-button slds-button_brand" title="Create"
                    onclick={quickCreateRecords}>Create</button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    <!--End Modal-->
</template>

<template if:true={isaDealTeam}>
    <c-navatar-Notes-Modal-D-C-Lwc onhiderecordmodal={cancelDealTeamCreate} selected-suggested-data={selectedSuggestedData}
    all-tagged-records={allTaggedRecords} new-tagged-records-list={newTaggList} at-tagged-records={atTaggedRecords}
    oncanceldealteamcreate={cancelDealTeamCreate} 
    new-deals-tagged-list={newDealsTaggedList} onopenfundteammodal={openFundTeamModal}  >

    </c-navatar-Notes-Modal-D-C-Lwc>
</template>

<template if:true={isaddContactToFundraising}>
   <c-navatar-Notes-Modal-F-D-R-C-Lwc new-fund-raising-records={newFundRaising} 
   all-tagged-records={allTaggedRecords} selected-suggested-data={selectedSuggestedData} at-tagged-records={atTaggedRecords}
   new-tagged-records-list={newTaggList} is-redirect-to-parent-screen={isRedirectToParentScreen} 
   onnavigatebacktoparentscreen={navigateScreen}
   ></c-navatar-Notes-Modal-F-D-R-C-Lwc>
</template>
<!--Notes view Pop up on new Note Added by Manonit start -->
<template if:true={isNewNote}>
<c-navatar-all-interactions-view-modal-lwc onnavigatebacktoparentscreen={closePopup} onhiderecordmodal={closePopup} > 
</c-navatar-all-interactions-view-modal-lwc>
</template>
<!--Notes view Pop up on new Note Added by Manonit End-->
</template>

<template>
    <div class="slds-form-element" style="width:100%; position:relative;right:4px;" >
      <div class="slds-form-element__control">
        <div class="slds-combobox_container">
          <div class={mainClass} aria-expanded="false" aria-haspopup="listbox" role="combobox">
            <div class="slds-combobox__form-element" role="none">
              <lightning-input type="search" style="display: grid;margin: auto;" class="slds-combobox__input"
                id="combobox-id" aria-controls="listbox-id" autocomplete="off" onfocus={showoptions}
                onchange={searchoption} onblur={toggleOnBlur} value={searchval} variant={inputVariant} name="name"
                placeholder="Search Field"><!--changed placehonder for bug #00042130 fixes by salauddin sheikh-->
              </lightning-input>
            </div>
            <div id="listbox-id" class="slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox" onmouseleave={toggle}>
              <template if:true={manageShowList}>
                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                  <template for:each={check_field_list} for:item="field">
                    <li key={field.index} role="presentation" class="slds-listbox__item">
                      <div key={field.index} id={field.index}
                        class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option"
                        onclick={selectoption}>
                        <span class="slds-media__body"> 
                          <span class="slds-truncate" title={field.displayName}>{field.displayName}</span>
                        </span>
                      </div>
                    </li>
                  </template>
                </ul>
              </template>
            </div>
          </div>
        </div>
      </div>
    </div>
  
    
  </template>

<template>
   
   <template if:true={showModal}>
       <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open">
           <div class="slds-modal__container" style="width:30rem;">
           <lightning-icon variant="inverse" size="small" icon-name="utility:close" alternative-text="close!" title="Close" class="slds-text-align_right slds-m-bottom_small slds-text-link_reset" onclick={closeNewtheme}></lightning-icon>
           <div class="slds-modal__header">
               <h1 class="slds-modal__title slds-hyphenate">New Theme</h1>
           </div>
           <div class="slds-modal__content slds-p-around_medium" style="height:280px;display:flex;align-items:center;justify-content:center;">
               <p style="font-size:18px;">Do you want to copy an existing Theme?</p>
           </div>
           <div class="slds-modal__footer">
               <button class="slds-button slds-button_neutral" title="No" aria-label="Cancel" onclick={newThemeNoPopclick}>No</button>
               <button class="slds-button slds-button_brand" title="Yes" onclick={newThemeYesPopclick}>Yes</button>
           </div>
           </div>
       </section>
       <template if:true={isEditScreen}>
       <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
       </template>
   </template>
       <template if:true={newThemeNoPop}>
           <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open main-Container-alltheme">
               <div class="slds-modal__container" style="width:30rem;">
               <lightning-icon variant="inverse" size="small" icon-name="utility:close" alternative-text="close!" title="Close" class="slds-text-align_right slds-m-bottom_small slds-text-link_reset" onclick={closeNewtheme}></lightning-icon>
               <div class="slds-modal__header">
                   <h1 class="slds-modal__title slds-hyphenate">New Theme</h1>
               </div>
   
           <lightning-record-edit-form  object-api-name="navpeII_dev18__Theme__c">
               <div class="slds-modal__content slds-p-around_medium" style="height:240px;">
                   <template if:true={isError}>
                       <div class="slds-p-bottom_medium ">
                       <div class="slds-notify slds-notify_alert slds-alert_error slds-float_left" role="alert">
                       <span class="slds-assistive-text">error</span>
                       <span class="slds-icon_containerslds-icon-utility-error slds-m-right_x-small" title="Description of icon when needed">
                       </span>
                       <h2 class="slds-p-left_medium slds-text-align_left errorleft">Review the errors on this page.</h2>
                       </div>
                       <template if:true={errorMessage}>
                       <p class="slds-p-left_medium slds-text-align_left"  style="color:red">{errorMessage}</p>
                       </template>
                   </div>
                   </template>   
                   <lightning-layout multiple-rows="true">
                       <lightning-layout-item size="12">                          
           <lightning-input-field field-name={field1}  value={themeName} data-id="Name" onchange={handleChange} required="">
           </lightning-input-field>
         </lightning-layout-item>
           <lightning-layout-item size="12" class="slds-m-top_xx-small descrp">
               <lightning-input-field field-name={field2} value={themeDesc} data-id="Description"  onchange={handleChange} >
               </lightning-input-field> 
               </lightning-layout-item>
           </lightning-layout>
           </div>
       </lightning-record-edit-form>
       <div class="slds-modal__footer">
           <button class="slds-button slds-button_neutral" aria-label="Cancel" title="Cancel" onclick={closeNewtheme} disabled={isThemeAccess}>Cancel</button>
           <button class="slds-button slds-button_brand"   type="submit" aria-label="Save" title="Save" onclick={handleNewTheme} disabled={isThemeAccess}>Save</button>
       </div>
      </div>
   </section>
         <template if:true={isEditScreen}>
           <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
         </template>
         </template>
         <template if:true={newThemeYesPop}>
						 <c-navatar-Copy-Theme-Lwc show-copy-screen={showCopyScreen} modal-title={title}  enable-spinner ={spinnerVar} is-theme-page={spinnerVar} open-modal={spinnerVar} show-list-view ={spinnerVar} is-all-themes={isAllThemes} is-edit-screen={isEditScreen} onchildsuccess ={handleChildComplete}></c-navatar-Copy-Theme-Lwc>
         </template>
   </template>

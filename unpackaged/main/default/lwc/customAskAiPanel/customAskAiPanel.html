<template>
    <!-- FAB Button (always visible) -->
    <button class={fabClass} onclick={handleFabClick}>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="margin-right:6px">
            <circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="1.8"/>
            <path d="M8 12h8M12 8v8" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        Ask AI
    </button>

    <!-- Panel -->
    <template lwc:if={visible}>
        <div class="ai-panel">
            <!-- Panel Header -->
            <div class="panel-header">
                <div class="panel-header__left">
                    <span class="panel-header__icon">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                            <circle cx="12" cy="12" r="10" stroke="#fff" stroke-width="1.8"/>
                            <path d="M12 8v4l3 3" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
                        </svg>
                    </span>
                    <span class="panel-header__title">Navatar AI</span>
                </div>
                <div class="panel-header__right">
                    <template lwc:if={isActionsMode}>
                        <button class="panel-back-btn" onclick={handleBackToEmpty}>← Back</button>
                    </template>
                    <template lwc:if={isChatMode}>
                        <button class="panel-back-btn" onclick={handleBackToActions}>← Actions</button>
                    </template>
                    <button class="panel-close-btn" onclick={handleClose} aria-label="Close">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                            <path d="M18 6L6 18M6 6l12 12" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Panel Body -->
            <div class="panel-body">

                <!-- EMPTY MODE: Default prompts -->
                <template lwc:if={isEmptyMode}>
                    <div class="panel-empty">
                        <div class="empty-greeting">
                            <div class="empty-greeting__title">Project Everest</div>
                            <div class="empty-greeting__sub">What would you like to know?</div>
                        </div>
                        <div class="prompts-list">
                            <template for:each={promptOptions} for:item="p">
                                <button key={p.id} class="prompt-btn" data-prompt={p.text} onclick={handlePromptClick}>
                                    <span class="prompt-btn__icon">{p.icon}</span>
                                    <span class="prompt-btn__text">{p.text}</span>
                                    <svg class="prompt-btn__arrow" width="12" height="12" viewBox="0 0 24 24" fill="none">
                                        <path d="M9 18l6-6-6-6" stroke="#706E6B" stroke-width="2" stroke-linecap="round"/>
                                    </svg>
                                </button>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- ACTIONS MODE: Context strip + actions -->
                <template lwc:if={isActionsMode}>
                    <div class="panel-actions">
                        <div class="context-strip">
                            <div class="context-strip__label">Selected insight</div>
                            <div class="context-strip__title">{actionTitle}</div>
                        </div>
                        <div class="actions-list">
                            <div class="actions-list__label">Recommended actions</div>
                            <template for:each={actions} for:item="action">
                                <button key={action.label} class={action.btnClass} data-label={action.label} onclick={handleActionClick}>
                                    <span class={action.iconClass}>{action.iconText}</span>
                                    <span class="action-btn__text">{action.label}</span>
                                </button>
                            </template>
                        </div>
                        <div class="prompts-toggle">
                            <button class="prompts-toggle-btn" onclick={handleTogglePrompts}>
                                {promptsToggleLabel}
                            </button>
                        </div>
                        <template lwc:if={promptsExpanded}>
                            <div class="prompts-list prompts-list--compact">
                                <template for:each={promptOptions} for:item="p">
                                    <button key={p.id} class="prompt-btn prompt-btn--compact" data-prompt={p.text} onclick={handlePromptClick}>
                                        <span class="prompt-btn__text">{p.text}</span>
                                    </button>
                                </template>
                            </div>
                        </template>
                    </div>
                </template>

                <!-- CHAT MODE: Messages -->
                <template lwc:if={isChatMode}>
                    <div class="chat-messages" lwc:ref="chatMessages">
                        <template for:each={messages} for:item="msg">
                            <div key={msg.id} class={msg.bubbleClass}>
                                <template lwc:if={msg.isAi}>
                                    <span class="bubble-ai-label">AI</span>
                                </template>
                                <div class="bubble-text">{msg.text}</div>
                                <div class="bubble-time">{msg.time}</div>
                            </div>
                        </template>
                    </div>
                    <div class="chat-prompts-toggle">
                        <button class="prompts-toggle-btn" onclick={handleTogglePrompts}>
                            {promptsToggleLabel}
                        </button>
                    </div>
                    <template lwc:if={promptsExpanded}>
                        <div class="prompts-list prompts-list--compact">
                            <template for:each={promptOptions} for:item="p">
                                <button key={p.id} class="prompt-btn prompt-btn--compact" data-prompt={p.text} onclick={handlePromptClick}>
                                    <span class="prompt-btn__text">{p.text}</span>
                                </button>
                            </template>
                        </div>
                    </template>
                </template>

            </div>

            <!-- Panel Footer: Input area (always visible) -->
            <div class="panel-footer">
                <div class="ai-selector-wrap">
                    <button class="ai-selector-btn" onclick={handleAiSelectorToggle}>
                        <span class="ai-selector-dot"></span>
                        {selectedAI}
                        <svg width="10" height="10" viewBox="0 0 24 24" fill="none">
                            <path d="M6 9l6 6 6-6" stroke="#706E6B" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <template lwc:if={aiSelectorOpen}>
                        <div class="ai-selector-popup">
                            <template for:each={aiOptions} for:item="opt">
                                <button key={opt.value} class="ai-option-btn" data-value={opt.value} onclick={handleAiOptionClick}>
                                    <span class="ai-option-dot" style={opt.dotStyle}></span>
                                    {opt.label}
                                    <template lwc:if={opt.isSelected}>
                                        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="margin-left:auto">
                                            <path d="M5 13l4 4L19 7" stroke="#0B2D5F" stroke-width="2.5" stroke-linecap="round"/>
                                        </svg>
                                    </template>
                                </button>
                            </template>
                        </div>
                    </template>
                </div>
                <div class={inputAreaClass}>
                    <textarea
                        class="ai-input"
                        placeholder="Ask about this deal..."
                        value={inputText}
                        oninput={handleInput}
                        onfocus={handleInputFocus}
                        onblur={handleInputBlur}
                        onkeydown={handleKeyDown}
                        rows="1">
                    </textarea>
                    <button class="send-btn" onclick={handleSend} disabled={isSendDisabled}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                            <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>

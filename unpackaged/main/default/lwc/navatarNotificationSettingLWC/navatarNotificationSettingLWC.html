                    </lightning-vertical-navigation-section>
                </lightning-vertical-navigation>

        </div>

                                <div >
                                    <lightning-layout>
                                        <lightning-layout-item size="6" class="slds-p-right_xx-small">
                                            <strong>Enable Action Notifications</strong><br />
                                            <!--<span>Allow users to activate add note/review tag notification.</span>-->

                                        <lightning-layout-item size="6">

                                    <lightning-layout>
                                        <lightning-layout-item size="6" class="slds-p-right_xx-small">

                                        </lightning-layout-item>
                                        <lightning-layout-item size="6">
                                            <lightning-input type="checkbox" name="reviewTag" onchange={handleReviewTag} disabled={isReviewTag} checked={setupRec.reviewTag}></lightning-input>

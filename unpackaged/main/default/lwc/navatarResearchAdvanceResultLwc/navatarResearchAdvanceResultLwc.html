      <template if:true={isCreateRecord}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"

            <div class="slds-modal__container" style="width:30rem;">

                    title="Close" class="slds-text-align_right slds-m-bottom_small slds-text-link_reset"
                    onclick={closeCreateRecord}></lightning-icon>

                    <!--Updated header text by LK on 2024-05-13 to fix 00045693-->
                    <h1 class="slds-modal__title slds-hyphenate">Create {themeLabel}</h1>
                </div>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-layout>
                        <lightning-layout-item size="12">
                            <!--Added onblur by LK on 2024-05-15 to fix 00045601-->
                            <lightning-input required="true" type="text" label={themeLabel} placeholder="Enter Name" onchange={setThemeName} onblur={btnDisableCheck}></lightning-input>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout>

                        <lightning-layout-item size="12" class="slds-m-top_small">
                            <lightning-textarea name="input1" label={themeDesLabel} onchange={setThemeDescription}></lightning-textarea>
                        </lightning-layout-item>

                    </lightning-layout>
                    <lightning-layout class="main-Container slds-m-top_small">
                        <lightning-layout-item size="12">
                            <div class="slds-section slds-is-open slds-m-vertical_none">
                                <button aria-controls="expando-unique-id" aria-expanded="true"
                                    class="slds-button expandablebtn" onclick={isExpandadvance}>
                                    <lightning-icon icon-name="utility:chevronright" size="xx-small"
                                        alternative-text="Advanced" title="Advanced"
                                        class="slds-m-right_xx-small hovLink" if:true={isCollapse}></lightning-icon>
                                    <lightning-icon icon-name="utility:chevrondown" size="xx-small"
                                        alternative-text="Advanced" title="Advanced"
                                        class="slds-m-right_xx-small hovLink" if:true={isExpand}></lightning-icon>
                                    <span class="slds-truncate" title="Advanced"
                                        style="font-size:14px;">Advanced</span>
                                </button>
                                <div class="slds-section__content slds-p-horizontal_small"
                                    if:true={isExpandCollapseBox}>
                                    <lightning-layout>
                                        <lightning-layout-item size="12">
                                            <div class="slds-border_left slds-border_right slds-border_top">
                                                <lightning-datatable key-field="id" data={dataCatogryForInternalPart} data-id="SelectedThemeCreateTable_id"
                                                    resize-column-disabled="true" columns={columnsCatogry}
                                                    selected-rows={selectedRows} onrowselection={getSelectedRec1} class="datatable_theme heightDataTable theme_css">
                                                </lightning-datatable>
                                            </div>
                                            <!--<template if:true={showCheckBoxForAllContactsForEachFirm}>
                                            <lightning-input class="slds-text-align_right slds-m-top_x-small" 
                                                type="checkbox" label="Include all contacts for each firm"
                                                name="input1" onchange={CreateTeamBooleanForAllContactsForEachFirm}></lightning-input>
                                                </template>-->
                                        </lightning-layout-item>
                                    </lightning-layout>
                                </div>
                            </div>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                <div class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" aria-label="Cancel" title="Cancel"
                        onclick={closeCreateRecord}>Cancel</button>
                    <button class="slds-button slds-button_brand" title="Create" onclick={createThemeApex} disabled={saveCheck}>Create</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>

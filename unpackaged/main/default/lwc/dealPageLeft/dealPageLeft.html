                                <tr><td><strong>Karen Philips</strong><br/><span class="slds-text-color_weak">L.E.K. Consulting</span></td><td><span class="gbadge">DD &amp; Experts</span></td><td>Commercial DD Lead</td><td><div class="rel-tp"><div class="dot dot-grey"></div>03 Jun</div></td><td class="slds-text-align_center">2</td></tr>
                                <tr><td><strong>Kirkland &amp; Ellis</strong><br/><span class="slds-text-color_weak">Legal Counsel</span></td><td><span class="gbadge">DD &amp; Experts</span></td><td>Legal DD</td><td><div class="rel-tp"><div class="dot dot-grey"></div>28 May</div></td><td class="slds-text-align_center">4</td></tr>

                            </tbody>
                        </table>
                    </div>
                </div>
            </lightning-tab>

            <!-- ═══ ACTIVITY ═══ -->
            <lightning-tab label="Deal Activity" value="activity" title="Deal Activity">
                <c-deal-activity-feed record-id={recordId}></c-deal-activity-feed>
            </lightning-tab>

            <!-- ═══ DETAILS ═══ -->
            <lightning-tab label="Details" value="details" title="Details">
                <div class="slds-p-around_medium">

                    <!-- Deal Information -->
                    <div class="ds">
                        <div class="ds-head">Deal Information</div>
                        <div class="slds-grid slds-wrap">
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Code Name</div><div class="ds-value">Project Everest</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Company Name</div><div class="ds-value">Apex Care Partners</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Deal Type</div><div class="ds-value">Buyout</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Current Stage</div><div class="ds-value"><span class="badge fb-deal">Due Diligence</span></div></div>

                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">HQ Location</div><div class="ds-value">London, UK</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Ownership Type</div><div class="ds-value">Founder-owned</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Process Type</div><div class="ds-value">Competitive Auction</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Competing Bidders</div><div class="ds-value">3 remaining</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Days in Stage</div><div class="ds-value">68 days</div></div>
                        </div>
                    </div>

                    <!-- Financial Summary -->
                    <div class="ds">
                        <div class="ds-head">Financial Summary</div>
                        <div class="slds-grid slds-wrap">
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Revenue (FY25A)</div><div class="ds-value">£38.0M</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">EBITDA (FY25A)</div><div class="ds-value">£8.2M</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">EBITDA Margin</div><div class="ds-value">21.6%</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Revenue Growth (3yr CAGR)</div><div class="ds-value">18.0%</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Entry Multiple (LOI)</div><div class="ds-value">11–13× EBITDA</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Implied Enterprise Value</div><div class="ds-value">£90–107M</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Equity Structure</div><div class="ds-value">Equity-heavy</div></div>
                            <div class="ds-field slds-col slds-size_1-of-1 slds-medium-size_1-of-2"><div class="ds-label">Debt Financing</div><div class="ds-value">~65% target</div></div>
                        </div>
                    </div>

                    <!-- Deal Timeline -->
                    <div class="ds">
                        <div class="ds-head">Deal Timeline</div>
                        <div class="ds-field">
                            <lightning-progress-indicator current-step="DD" type="base">
                                <lightning-progress-step label="Teaser" value="Teaser" title="Teaser Received · 22 Jan 2026"></lightning-progress-step>
                                <lightning-progress-step label="NDA"    value="NDA"    title="NDA Signed · 28 Jan 2026"></lightning-progress-step>
                                <lightning-progress-step label="CIM"    value="CIM"    title="CIM Received · 12 Feb 2026"></lightning-progress-step>
                                <lightning-progress-step label="Mgmt"   value="Mgmt"   title="Management Meeting · 08 Mar 2026"></lightning-progress-step>
                                <lightning-progress-step label="IC"     value="IC"     title="IC Review · 28 May 2026"></lightning-progress-step>
                                <lightning-progress-step label="LOI"    value="LOI"    title="LOI Submitted · 14 Mar 2026"></lightning-progress-step>
                                <lightning-progress-step label="DD"     value="DD"     title="Due Diligence · Current · Day 68"></lightning-progress-step>
                                <lightning-progress-step label="Close"  value="Close"  title="Close · TBC"></lightning-progress-step>
                            </lightning-progress-indicator>
                        </div>
                    </div>

                    <!-- Deal Team -->
                    <div class="ds">
                        <div class="ds-head">Deal Team</div>
                        <ul>
                            <li class="slds-media slds-media_center slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure"><lightning-avatar initials="TB" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Thomas Bennett</p><p class="slds-text-body_small slds-text-color_weak">Deal Lead · Partner</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="gbadge">Lead</span></div>
                            </li>
                            <li class="slds-media slds-media_center slds-p-around_x-small">
                                <div class="slds-media__figure"><lightning-avatar initials="SP" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Sarah Patel</p><p class="slds-text-body_small slds-text-color_weak">Analyst</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="gbadge">Analyst</span></div>
                            </li>
                        </ul>
                    </div>

                    <!-- External Parties -->
                    <div class="ds">
                        <div class="ds-head">External Parties</div>
                        <ul>
                            <li class="slds-media slds-media_center slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure"><lightning-avatar initials="MH" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Michael Hartley</p><p class="slds-text-body_small slds-text-color_weak">Source Banker · MD Healthcare · Houlihan Lokey</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="gbadge">Banker</span></div>
                            </li>
                            <li class="slds-media slds-media_center slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure"><lightning-avatar initials="KE" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Kirkland &amp; Ellis</p><p class="slds-text-body_small slds-text-color_weak">Legal DD – report expected 16 Jun 2026</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="gbadge">Legal</span></div>
                            </li>
                            <li class="slds-media slds-media_center slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure"><lightning-avatar initials="KP" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Karen Philips – L.E.K. Consulting</p><p class="slds-text-body_small slds-text-color_weak">Commercial DD – report expected 20 Jun 2026</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="gbadge">Commercial</span></div>
                            </li>
                            <li class="slds-media slds-media_center slds-p-around_x-small">
                                <div class="slds-media__figure"><lightning-avatar initials="MW" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Dr. Marcus Webb</p><p class="slds-text-body_small slds-text-color_weak">Regulatory Expert – report received today · gap flagged</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="badge fb-gap">Gap</span></div>
                            </li>
                        </ul>
                    </div>

                    <!-- Key Contacts at Target -->
                    <div class="ds">
                        <div class="ds-head">Key Contacts at Target</div>
                        <ul>
                            <li class="slds-media slds-media_center slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure"><lightning-avatar initials="MH" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Mark Hargreaves</p><p class="slds-text-body_small slds-text-color_weak">CEO · 12 years tenure · holds 14 of 22 NHS referral relationships</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="badge fb-risk">Retention Risk</span></div>
                            </li>
                            <li class="slds-media slds-media_center slds-p-around_x-small">
                                <div class="slds-media__figure"><lightning-avatar initials="SC" fallback-icon-name="standard:user" size="small"></lightning-avatar></div>
                                <div class="slds-media__body"><p class="slds-text-body_small">Sarah Chen</p><p class="slds-text-body_small slds-text-color_weak">CFO · joined 2023 · materially improved financial controls</p></div>
                                <div class="slds-media__figure slds-media__figure_reverse"><span class="badge fb-call">Strong</span></div>
                            </li>
                        </ul>
                    </div>

                </div>
            </lightning-tab>

            <!-- ═══ RELATIONSHIP INTELLIGENCE ═══ -->
            <lightning-tab label="Rel. Intelligence" value="ri" title="Relationship Intelligence">
                <div class="slds-p-around_medium">

                    <!-- AI Intelligence alerts -->
                    <div class="ds slds-m-bottom_medium">
                        <div class="ds-head">
                            AI Intelligence &nbsp;<span class="badge fb-ai">AI Generated</span>
                        </div>
                        <ul>
                            <li class="slds-media slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure slds-align_absolute-center"><lightning-icon icon-name="utility:warning" size="x-small" variant="warning"></lightning-icon></div>
                                <div class="slds-media__body"><p class="slds-text-body_small"><strong>Karen Philips (L.E.K.) has had no logged interaction in 12 days</strong></p><p class="slds-text-body_small slds-text-color_weak">Commercial DD report expected 20 Jun — 6 days away. Last contact was email 03 Jun. Consider a check-in call to confirm timeline.</p></div>
                            </li>
                            <li class="slds-media slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure slds-align_absolute-center"><lightning-icon icon-name="utility:warning" size="x-small" variant="warning"></lightning-icon></div>
                                <div class="slds-media__body"><p class="slds-text-body_small"><strong>Mark Hargreaves not contacted in 26 days — retention package still unconfirmed</strong></p><p class="slds-text-body_small slds-text-color_weak">Last interaction was the 20 May management meeting. Advent have approached him. Recommend direct contact before 18 Jun.</p></div>
                            </li>
                            <li class="slds-media slds-p-around_x-small slds-border_bottom">
                                <div class="slds-media__figure slds-align_absolute-center"><lightning-icon icon-name="utility:add" size="x-small" variant="success"></lightning-icon></div>
                                <div class="slds-media__body"><p class="slds-text-body_small"><strong>Warm path to Prof. Helen Cross (CMS specialist) not yet activated</strong></p><p class="slds-text-body_small slds-text-color_weak">Prof. Cross identified as a connection via Jonathan Reid. Given the CMS gap flagged today, her input would be directly relevant.</p></div>
                            </li>
                            <li class="slds-media slds-p-around_x-small">
                                <div class="slds-media__figure slds-align_absolute-center"><lightning-icon icon-name="utility:info" size="x-small"></lightning-icon></div>
                                <div class="slds-media__body"><p class="slds-text-body_small"><strong>Kirkland &amp; Ellis — all interactions email only since LOI</strong></p><p class="slds-text-body_small slds-text-color_weak">No verbal update logged since LOI submission. The CMS gap falls within their scope. A call to brief them before 18 Jun would be useful.</p></div>
                            </li>
                        </ul>
                    </div>

                    <!-- People filter — custom pill toggle for navy active state -->
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small slds-wrap">
                        <div class="ri-toggle">
                            <span class={rfc.all}      data-g="all"      onclick={handleRiFilter}>All</span>
                            <span class={rfc.internal} data-g="internal" onclick={handleRiFilter}>Internal</span>
                            <span class={rfc.banker}   data-g="banker"   onclick={handleRiFilter}>Banker</span>
                            <span class={rfc.dd}       data-g="dd"       onclick={handleRiFilter}>DD &amp; Experts</span>
                            <span class={rfc.target}   data-g="target"   onclick={handleRiFilter}>Target</span>
                        </div>
                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">{riCountLabel}</span>
                    </div>

                    <div class="slds-scrollable_x">
                        <table class="slds-table slds-table_bordered slds-table_cell-buffer slds-no-row-hover slds-text-body_small ri-table">
                            <thead>
                                <tr class="slds-line-height_reset">
                                    <th scope="col" class="tbl-th" style="width:200px">Person</th>
                                    <th scope="col" class="tbl-th" style="width:110px">Group</th>
                                    <th scope="col" class="tbl-th" style="width:160px">Role</th>
                                    <th scope="col" class="tbl-th" style="width:190px">Contact</th>
                                    <th scope="col" class="tbl-th" style="width:160px">Last Touchpoint</th>
                                    <th scope="col" class="tbl-th" style="width:60px">&#8596;</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={riPeople} for:item="p">
                                    <tr key={p.id}>
                                        <td>
                                            <div class="slds-media slds-media_center">
                                                <div class="slds-media__figure">
                                                    <lightning-avatar initials={p.initials} fallback-icon-name="standard:user" size="small"></lightning-avatar>
                                                </div>
                                                <div class="slds-media__body slds-has-flexi-truncate">
                                                    <p class="slds-truncate slds-text-body_small">{p.name}</p>
                                                    <p class="slds-truncate slds-text-body_small slds-text-color_weak">{p.org}</p>
                                                </div>
                                            </div>
                                        </td>
                                        <td><span class="gbadge">{p.groupLabel}</span></td>
                                        <td>{p.role}</td>
                                        <td class="slds-text-color_weak">{p.email}</td>
                                        <td>
                                            <p class="slds-text-body_small slds-m-bottom_xx-small">{p.lastDate}</p>
                                            <span class={p.lastBadgeCss}>{p.lastBadge}</span>
                                        </td>
                                        <td class="slds-text-align_center">{p.interactions}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </lightning-tab>

            <!-- ═══ INTERACTIONS ═══ -->
            <lightning-tab label="Interactions" value="int" title="Interactions">
                <div class="slds-p-around_medium">
                    <div class="slds-grid slds-grid_vertical-align-center slds-m-bottom_small">
                        <h3 class="slds-text-heading_small">Interactions</h3>
                        <span class="slds-text-body_small slds-text-color_weak slds-m-left_small">6 logged</span>
                        <lightning-button label="+ Log" variant="neutral" class="slds-col_bump-left"></lightning-button>
                    </div>
                    <div class="slds-scrollable_x">
                        <table class="int-tbl">
                            <thead>
                                <tr>
                                    <th style="width:100px">Date</th>
                                    <th>Subject</th>
                                    <th style="width:160px">People</th>
                                    <th style="width:200px">Tags</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={interactions} for:item="row">
                                    <tr key={row.id} class="int-row" data-id={row.id} onclick={handleIntClick}>
                                        <td class="int-date">
                                            <div>{row.date}</div>
                                            <span class={row.badgeCss} style="margin-top:3px">{row.type}</span>
                                        </td>
                                        <td>
                                            <div class="int-subj">{row.subject}</div>
                                            <div class="int-prev">{row.preview}</div>
                                        </td>
                                        <td>
                                            <div class="int-ppl">
                                                <template for:each={row.people} for:item="person">
                                                    <span key={person.id} class="int-av" style={person.avStyle}>{person.initials}</span>
                                                </template>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="int-tags">
                                                <template for:each={row.tags} for:item="tag">
                                                    <span key={tag} class="int-tag">{tag}</span>
                                                </template>
                                            </div>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <a class="slds-text-link slds-text-body_small slds-m-top_small slds-show">Load all interactions (12)</a>
                </div>
            </lightning-tab>

            <!-- ═══ DOCUMENTS ═══ -->
            <lightning-tab label="Documents" value="docs" title="Documents">
                <ul class="slds-card__body">

    <!-- ═══ CLICK MAP TOGGLE ═══ -->
    <button class="cmap-toggle" onclick={toggleClickMap} title="Show all clickable areas">
        <template if:false={showClickMap}>&#9776; Click Map</template>
        <template if:true={showClickMap}>&#10005; Close Map</template>
    </button>

    <!-- ═══ CLICK MAP OVERLAY ═══ -->
    <template if:true={showClickMap}>
        <div class="cmap-overlay">
            <!-- numbered badges positioned over each element -->
            <template for:each={clickPoints} for:item="pt">
                <div key={pt.id} class="cmap-badge" style={pt.style}>{pt.num}</div>
            </template>
        </div>
        <!-- legend panel -->
        <div class="cmap-legend">
            <div class="cmap-legend-head">
                <span>Click Map — {clickPoints.length} targets</span>
                <button class="cmap-legend-close" onclick={closeClickMap}>&#10005;</button>
            </div>
            <ul class="cmap-legend-list">
                <template for:each={clickPoints} for:item="pt">
                    <li key={pt.id} class="cmap-legend-item">{pt.label}</li>
                </template>
            </ul>
        </div>
    </template>

    <!-- ═══ INTERACTION DETAIL MODAL ═══ -->
    <template if:true={showIntModal}>
        <div class="int-modal-bg" onclick={handleModalBgClick}>
            <div class="int-modal-wrap" onclick={stopProp}>

                <!-- Header -->
                <div class="int-modal-head">
                    <div class="int-modal-icon-wrap">
                        <lightning-icon icon-name={selectedIntIcon} size="small"></lightning-icon>
                    </div>
                    <div class="int-modal-title-area">
                        <div>
                            <span class={selectedInt.badgeCss}>{selectedInt.type}</span>
                            &nbsp;<span class="int-modal-date">{selectedInt.date}</span>
                        </div>
                        <div class="int-modal-subject">{selectedInt.subject}</div>
                    </div>
                    <div class="int-modal-acts">
                        <template if:true={intViewMode}>
                            <button class="int-act-btn int-act-edit" onclick={handleIntEdit} title="Edit">
                                <lightning-icon icon-name="utility:edit" size="x-small"></lightning-icon>
                            </button>
                            <button class="int-act-btn int-act-del" onclick={handleIntDelete} title="Delete">
                                <lightning-icon icon-name="utility:delete" size="x-small"></lightning-icon>
                            </button>
                        </template>
                        <button class="int-act-btn int-act-close" onclick={closeIntModal} title="Close">
                            <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                        </button>
                    </div>
                </div>

                <div class="int-modal-divider"></div>

                <!-- VIEW mode -->
                <template if:true={intViewMode}>
                    <div class="int-modal-body">

                        <div class="int-modal-sect">
                            <div class="int-sect-label">Notes</div>
                            <div class="int-sect-body int-notes-text">{selectedInt.notes}</div>
                        </div>

                        <div class="int-modal-sect">
                            <div class="int-sect-label">People</div>
                            <div class="int-sect-body">
                                <template for:each={selectedInt.people} for:item="person">
                                    <div key={person.id} class="int-person-row">
                                        <span class="int-av int-av-lg" style={person.avStyle}>{person.initials}</span>
                                        <div>
                                            <div class="int-person-name">{person.name}</div>
                                            <div class="int-person-org">{person.org}</div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <div class="int-modal-sect">
                            <div class="int-sect-label">Tags</div>
                            <div class="int-sect-body">
                                <div class="int-tags">
                                    <template for:each={selectedInt.tags} for:item="tag">
                                        <span key={tag} class="int-tag">{tag}</span>
                                    </template>
                                </div>
                            </div>
                        </div>

                    </div>
                </template>

                <!-- EDIT mode -->
                <template if:false={intViewMode}>
                    <div class="int-modal-body">
                        <div class="int-modal-sect">
                            <div class="int-sect-label">Subject</div>
                            <lightning-input value={editSubject} onchange={handleEditSubjectChange}></lightning-input>
                        </div>
                        <div class="int-modal-sect">
                            <div class="int-sect-label">Notes</div>
                            <lightning-textarea value={editNotes} oninput={handleEditNotesInput} max-rows="12"></lightning-textarea>
                        </div>
                    </div>
                    <div class="int-modal-footer">
                        <lightning-button label="Cancel" variant="neutral" onclick={handleIntCancel} class="slds-m-right_small"></lightning-button>
                        <lightning-button label="Save"   variant="brand"   onclick={handleIntSave}></lightning-button>
                    </div>
                </template>

            </div>
        </div>
    </template>

</template>

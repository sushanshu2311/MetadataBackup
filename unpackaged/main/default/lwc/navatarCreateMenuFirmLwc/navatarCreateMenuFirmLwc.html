         </template>

                <!-- Modal/Popup Box body starts here -->
                <!--new change error message start-->
                <template if:true={isError}>
                    <div class="slds-p-horizontal_large slds-p-top_medium slds-p-bottom_medium">
                        <div class="slds-notify slds-notify_alert slds-alert_error" style="display: -webkit-box;" role="alert">
                            <span class="slds-assistive-text">error</span>
                            <span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Error">
                            </span>
                            <h2>Review the errors on this page.</h2>
                        </div>
                        <p class="slds-p-left_medium" style="color:red">{errorMessage} </p>
                    </div>
                </template>
       
        <!--new change error message end-->
             <lightning-record-edit-form object-api-name="Account"  onload={handleLoad}> 
                <div class="for_desk slds-modal__content slds-p-vertical_medium error_custom_css" id="modal-content-id-1">
                    <lightning-layout class="slds-p-horizontal_large slds-p-bottom_x-small">
                        <lightning-layout-item size="12" flexibility="auto">
                            <lightning-input-field field-name={labelName} data-id="name" onchange={handleName} value={Name} style="padding: 0px !important;" required> </lightning-input-field>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout class="slds-p-horizontal_large slds-p-bottom_x-small slds-p-top_x-small">
                        <lightning-layout-item size="12" flexibility="auto">
                            <lightning-combobox label={recordType} value={statusValue} options={recordTypepicklist} onchange={handleRecordTypeChange} dropdown-alignment="auto">
                            </lightning-combobox>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>
                <div class="for_mob slds-p-vertical_medium error_custom_css">
                    <h2 class="slds-text-heading_medium slds-hyphenate slds-p-vertical_small for_mob text_center">Add Firm</h2>
                    <lightning-layout class="slds-p-horizontal_large slds-p-bottom_x-small">
                        <lightning-layout-item size="12" flexibility="auto">
                            <lightning-input-field field-name={labelName} data-id="name" onchange={handleName} style="padding: 0px !important;" required> </lightning-input-field>
                        </lightning-layout-item>
                    </lightning-layout>
                    <lightning-layout class="slds-p-horizontal_large slds-p-bottom_x-small slds-p-top_x-small">
                        <lightning-layout-item size="12" flexibility="auto">
                            <lightning-combobox label={recordType} value={statusValue} options={recordTypepicklist} onchange={handleRecordTypeChange} dropdown-alignment="auto">
                            </lightning-combobox>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>

                <!-- Modal/Popup Box LWC footer starts here -->
                <footer class="slds-modal__footer cutomFooter">
                    <lightning-button label="Cancel" title="Cancel" onclick={closeModal} class="for_desk slds-m-left_x-small">
                    </lightning-button>
                    <lightning-button
                    variant="brand"
                    class="slds-m-left_x-small customBrandButton"
                    title="Save" label="Save"  onclick={handleSave}
                >
                </lightning-button>
                </footer>
                 </lightning-record-edit-form> 
    </div>
    </template>
    
</template>

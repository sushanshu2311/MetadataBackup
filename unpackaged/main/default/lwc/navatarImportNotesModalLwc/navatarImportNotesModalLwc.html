<template>

    <!-- Modal/Popup Box starts here -->
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open ">
        <div class="slds-modal__container">
            <!-- Modal/Popup Box header here -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close"
                    onclick={closeImportModal}>
                    <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"
                        title="Close">
                    </lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-08" class="slds-text-heading_medium slds-hyphenate" style="line-height: 38px;">
                    Import </h2>
            </header>
            <!-- Modal/Popup Box body starts here -->
            <div class="slds-modal__content " id="modal-content-id-23">
                <template if:true={isLoading}>
                    <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
                </template>
                <div class="slds-box slds-theme--default">
                    <iframe src={siteURL} height="110px" style="border: none;" width="100%"></iframe>
                </div>
            </div>
            <div id="demo">
            </div>
            <!-- Modal/Popup Box LWC footer starts here -->
            <footer class="slds-modal__footer cutomFooter">
                <lightning-button variant="brand" label="Close" onclick={closeImportModal} title="Close"
                    class="slds-m-left_x-small customBrandButton cur_point pillClass cur_pointer"
                    style="float:right"></lightning-button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

<template>
    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
        class="slds-modal slds-fade-in-open">

        <!--// 00045106 fixed by raju 09-05-2024 (Add 'clsMainContainer' this class)-->
        <div class="slds-modal__container clsMainContainer">
            <lightning-icon variant="inverse" size="small" icon-name="utility:close" alternative-text="Close!"
                title="Close" class="slds-text-align_right slds-text-link_reset slds-m-bottom_medium"
                onclick={hideRecordModal}></lightning-icon>

            <!--Start Header-->
            <div class="slds-modal__header">
                <h1 class="slds-modal__title slds-hyphenate">Add Contacts to Deal Team</h1>
            </div>
            <!--End Header-->

            <div class="slds-modal__content slds-p-around_medium">

                <!--Start Header-->
                <lightning-layout class="slds-grid slds-wrap slds-theme_shade slds-border_around">
                    <lightning-layout-item class="slds-col slds-size_1-of-12">
                        <lightning-input type="checkbox" name="input1" onchange={handleDealGlobalCheck}
                            class="cls_marginLeftMinus" data-id="dealGlobalCheckId" checked = {globalCheck}>
                        </lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item class="slds-col slds-size_3-of-12 cls_header" title="Name">
                        <strong>Name</strong>
                    </lightning-layout-item>
                    <lightning-layout-item class="slds-col slds-size_3-of-12 cls_header" title="Firm">
                        <strong>Firm</strong>
                    </lightning-layout-item>
                    <lightning-layout-item class="slds-col slds-size_5-of-12 cls_header" title="Role">
                        <strong>Role</strong>
                    </lightning-layout-item>
                </lightning-layout>
                <!--End Header-->

                <!--Start Row-->
                <template if:true={contactTaggedRecords}>
                    <template for:each={contactTaggedRecords} for:item="dealContact">
                        <lightning-layout class="slds-p-around_x-small align_center clrChange" key={dealContact.index}>
                            <lightning-layout-item class="slds-col slds-size_1-of-12">
                                <lightning-input type="checkbox" name="input1" data-id={dealContact.index}
                                    onchange={handleDealContactCheckBox} checked={dealContact.isSelected}>
                                </lightning-input>
                            </lightning-layout-item>
                            <lightning-layout-item class="slds-col slds-size_3-of-12 truncate_text_css" title={dealContact.conName}>{dealContact.conName}
                            </lightning-layout-item>
                            <lightning-layout-item class="slds-col slds-size_3-of-12 truncate_text_css" title={dealContact.accName}>{dealContact.accName}
                            </lightning-layout-item>
                            <lightning-layout-item class="slds-col slds-size_5-of-12">
                                <lightning-combobox name="Role" variant="label-hidden" dropdown-alignment="auto"
                                    value={dealContact.role} data-id={dealContact.index} placeholder="None"
                                    options={optionsDeal} onchange={handleDealRoleChange} class="comb_css dropdownout_css"> <!--Critical Bug fix Nikita S-->
                                </lightning-combobox>
                            </lightning-layout-item>
                        </lightning-layout>
                    </template>
                </template>



            </div>
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" title="Cancel"
                    onclick={cancelDealTeamCreate}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleDealTeamCreate} title="Add">Add</button>
            </div>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    <!--End Modal-->
</template>

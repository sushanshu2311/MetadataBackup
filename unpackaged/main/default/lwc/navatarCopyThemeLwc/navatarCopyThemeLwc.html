<!--
** Module Name : Acuity 2.0 - Acuity
** Description : To copy the selected theme related records
** Throws : NA
** Calls : NA
** Organization : Navatar Group
** Product Name & Version : Acuity 2.0
** Revision History:-
** Version    Date(YYYY-MM-DD)    Author         Description of Action
** 1.0        2022-11-28          Hema
-->
<template>

   <div class="listdiv">
       <template if:true={openModal}>
          <!-- Record form changes start -->
          <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
               class="slds-modal slds-fade-in-open">
               <div class="slds-modal__container" style="width:30rem;">
                   <lightning-icon variant="inverse" size="small" icon-name="utility:close" alternative-text="close!"
                       title="Close" class="slds-text-align_right slds-m-bottom_small slds-text-link_reset"
                       onclick={closeCopyModal}></lightning-icon>
                   <div class="slds-modal__header">
                       <h1 class="slds-modal__title slds-hyphenate">{modalTitle}</h1>
                   </div>
                   <lightning-record-edit-form  object-api-name="navpeII_dev18__Theme__c"> <!--Modified by Hema 14-04-2023-->
                       <div class="slds-modal__content slds-p-around_medium" style="height:280px;">
                           <template if:true={isError}>
                               <div class="slds-p-bottom_medium">
                               <div class="slds-notify slds-notify_alert slds-alert_error" role="alert">
                               <span class="slds-assistive-text">error</span>
                               <span class="slds-icon_containerslds-icon-utility-error slds-m-right_x-small" title="Description of icon when needed">
                               </span>
                               <h2 class="slds-p-left_medium slds-text-align_left errorleft">Review the errors on this page.</h2>
                               </div>
                               <template if:true={errorMessage}>
                               <p class="slds-p-left_medium slds-text-align_left"  style="color:red">{errorMessage}</p>
                               </template>
                           </div>
                       </template>

                       <template if:true={showCopyScreen}>
                        <lightning-layout style="padding: 0 5px;">
                               <lightning-layout-item size="12" class="slds-m-top_xx-small lookup_css_h">
                                   <span style="color: red;margin-right:2px;">*</span>
                                   <label class="slds-form-element__label slds-no-flex">Existing Theme Name</label>
                                   <c-navatar-Single-Lookup-Lwc obj-name="navpeII_dev18__Theme__c"
                                       search-placeholder="Search Themes..." is-theme-page={isThemePage}
                                       selected-id={existingRecId} onlookupselected={handleSelectedRecord}><!--Modified by Hema 14-04-2023-->
                                   </c-navatar-Single-Lookup-Lwc>
                               </lightning-layout-item>
                           </lightning-layout>
                       </template>
                       <template if:false={showCopyScreen}>
                        <lightning-layout style="padding: 0 5px;">
                               <lightning-layout-item size="12" class="slds-m-top_xx-small lookup_css_h">
                                   <span style="color: red;margin-right:2px;">*</span>
                                   <label class="slds-form-element__label slds-no-flex">Existing Theme Name</label>
                                   <c-navatar-Single-Lookup-Lwc obj-name="navpeII_dev18__Theme__c" 
                                       search-placeholder="Search Themes..." is-theme-page={isThemePage}
                                       onlookupselected={handleSelectedRecord}></c-navatar-Single-Lookup-Lwc><!--Modified by Hema 14-04-2023-->
                               </lightning-layout-item>
                           </lightning-layout>
                       </template>
                       <lightning-layout multiple-rows="true" class="slds-m-top_xx-small">

                           <lightning-layout-item size="12">
                               <lightning-input-field field-name={field1}  value={themeName} data-id="Name"  onchange={handleChange} required="">
                               </lightning-input-field>
                           </lightning-layout-item>
                           <lightning-layout-item size="12" class="slds-m-top_xx-small">

                               <lightning-input-field field-name={field2} value={themeDesc} data-id="Description"  onchange={handleChange} >
                               </lightning-input-field>
                           </lightning-layout-item>
                           <lightning-layout-item size="12" class="slds-m-top_small slds-text-align_right">
                               <lightning-input type="checkbox" label="Copy All Interactions" name="All Interactions"
                                   onchange={handleInteractions}>
                               </lightning-input>
                           </lightning-layout-item>
                       </lightning-layout>
                   </div>
                   </lightning-record-edit-form>
                   <div class="slds-modal__footer">
                       <button class="slds-button slds-button_neutral" aria-label="Cancel" title="Cancel"
                           onclick={closeCopyModal} disabled={isThemeAccess}>Cancel</button>
                       <button class="slds-button slds-button_brand" onclick={handleSave}
                           title="Save" disabled={isThemeAccess}>Save</button>
                   </div>
               </div>
           </section>
           <!-- Record form changes end -->
           <template if:true={isEditScreen}>
             <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
       </template>
       </template>
   </div>

   <template if:false={enableSpinner}>
       <lightning-spinner alternative-text="Loading..." style="z-index:15002" class="spinner_css">
       </lightning-spinner>
   </template>
</template>

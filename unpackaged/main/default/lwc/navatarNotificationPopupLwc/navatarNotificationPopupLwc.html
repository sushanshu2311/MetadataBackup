    ** Calls : NA
    ** Organization : Navatar Group
    ** Product Name & Version : Connections 2.0
    ** Revision History:-
    ** Version    Date(YYYY-MM-DD)    Author         Description of Action
    ** 1.0        2022-08-02          Priyank        fetch and update event's records
    ** 2.0        2022-08-30          Priyank        merge with UI 2
    ** 3.0        2022-09-26          Priyank        update as per new CR
    ** 4.0        2022-11-14          Adil           update phase 2 UI

****************************************************************************************************/ -->
<template>
      <template if:true={isShowModal}> 
          <!-- Modal/Popup Box starts here -->
          <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
              aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open main-Container-noti"> 
              
              <div class="slds-modal__container">
                  <!-- Modal/Popup Box header here -->
                  <header class="slds-modal__header">
                      <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                          title="Close" onclick={hideModalBox}>
                          <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                              size="small" title="Close">
                          </lightning-icon>
                          <span class="slds-assistive-text">Close</span>
                      </button> 
                      <ul class="slds-grid slds-wrap" style="align-items: center;display: flex;justify-content: center;">
                          <li>
                              <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate fit-width-content"
                                  title="Notifications" style="margin: auto;">
                                  Notifications</h2>
                          </li>
                          <li style="position: absolute;right: 26px;">
                              <lightning-icon icon-name="utility:refresh" size="x-small" alternative-text="Refresh!"
                                  title="Refresh" class="slds-text-link_reset" onclick={refreshNotification}>
                              </lightning-icon>
                          </li>
                      </ul>
                  </header>
                  <!-- Modal/Popup Box body starts here -->
                  <div class="slds-modal__content hght" id="modal-content-id-1">
                        <div class="spinnerClass">
                            <template if:true={isLoading}>
                            <lightning-spinner alternative-text="Loading" size="large" class="spinnerCSS" variant="brand"></lightning-spinner>
                            </template>
                        
                      <template for:each={notificationRecords} for:item="data" for:index="index">
                      <lightning-layout vertical-align="center"
                          class={data.rowClass} key={data.id} data-index={index}>
                          
                          <lightning-layout-item size="1" class="slds-text-align_center">
                              <lightning-icon  if:true={nnIsDeleteable} icon-name="utility:clear" class="cur_point" size="x-small"
                                  onclick={dismissNotification} title="Dismiss Notification" data-id={data.id}></lightning-icon>
                          </lightning-layout-item>
                          <lightning-layout-item padding="around-small" size="7">
                            <p class="slds-truncate"><b><a onclick={viewNotificationClick} target="_blank" class="noti" title={data.subject}
                                data-record-id={data.recordId}  data-id={data.id} data-index={index} data-type={data.recObjType}>{data.subject}</a></b>
                            </p>
                              <p class="slds-line-clamp_x-small"
                                  title={data.description}>
                                  {data.description}</p>
                          </lightning-layout-item>
                          <lightning-layout-item padding="around-small" size="4" class="slds-text-align_right">
                              <lightning-button variant="brand" label="Add Note" title="Add Note"
                                  class="customBrandButton for_desk" value={data.id} data-index={index} onclick={clickAddNote} if:true={data.isAddNote}></lightning-button>
                              <lightning-button variant="brand" label="Review Tag" title="Review Tag"
                                  class="customBrandButton customButtonWidth" value={data.id} data-index={index} onclick={clickAddTag} if:true={data.isAddTag}></lightning-button>    
                          </lightning-layout-item>
                      </lightning-layout>
                  </template>
                </div>
              </div>
         
                  <!-- Modal/Popup Box LWC footer starts here -->
                  <footer class="slds-modal__footer cutomFooter">
                      <!-- <a class="slds-button slds-float_left" href="#">Dismiss all notifications</a> -->
                      <lightning-button onclick={snoozeForToday} label="Snooze" title="Snooze" class="slds-m-left_x-small">
                      </lightning-button>
                      <lightning-button variant="brand" label="Close" title="Close" onclick={hideModalBox}
                          class="slds-m-left_x-small customBrandButton for_desk"></lightning-button> 
                  </footer>
              </div>
          </section> 
        <div class="slds-backdrop slds-backdrop_open"></div> 
      </template> 
  </template>

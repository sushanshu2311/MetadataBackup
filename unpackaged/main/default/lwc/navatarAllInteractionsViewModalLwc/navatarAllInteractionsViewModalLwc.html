                                                  open-suggested-tags={openSuggestedTag} 
                                                  is-redirect-to-record={isRedirectToRecord} 
                                                  onclosemodal={handleCloseModal} 
                                                  oncancelchanges={noteModalClosed}
                                                  is-redirect-to-parent-screen={redirectToParent}
                                                  open-tag={directlyOpenSuggestedTag}
                                                  redirect-id = {redirectId}
                                                  >

        </c-navatar-notes-modal-lwc>
    </template><!-- Manonit 00045538 Bug Fix-->

    <template if:true={isDelete}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container creatrecord_css">
    
                <lightning-layout>
                    <lightning-layout-item size="12" class="slds-text-align_right">
                        <lightning-icon variant="inverse" size="small" icon-name="utility:close" alternative-text="Close!"
                            title="Close" class="slds-text-link_reset slds-m-bottom_medium"
                            onclick={closeDelete}></lightning-icon>
                    </lightning-layout-item>
                </lightning-layout>
    
                <!--Start Header-->
                <div class="slds-modal__header">
                    <!-- Bug 00044442 Fixed on 01-04-2024 By Sudhanshu -->
                    <h1 class="slds-modal__title slds-hyphenate">Delete Interaction</h1>
                </div>
                <!--End Header-->
    
                <div class="slds-modal__content slds-p-around_medium">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading" size="large" variant="brand"></lightning-spinner>
                    </template>
                    <div class="slds-align_absolute-center">
                        Are you sure you want to delete this Interaction?
                    </div>
                </div>
                <div class="slds-modal__footer">
                    <!-- <button class="slds-button slds-button_neutral" aria-label="Delete" title="Delete"
                        onclick={handleDelete}>Delete</button> -->
                    <button class="slds-button slds-button_neutral" title="Cancel"
                        onclick={closeDelete}>Cancel</button>
                    <button class="slds-button slds-button_brand" title="Delete"
                        onclick={handleDeleteNote}>Delete</button>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
        <!--End Modal-->
    </template>

<template>
    <!-- Modal/Popup Box body starts here -->
    <template if:true={showError}>
		<div class="slds-p-horizontal_large slds-p-top_medium slds-p-bottom_medium">
			<div class="slds-notify slds-notify_alert slds-alert_error" style="display: -webkit-box;" role="alert">
				<span class="slds-assistive-text">error</span>
				<span class="slds-icon_container slds-icon-utility-error slds-m-right_x-small" title="Error">
				</span>
				<h2>Review the errors on this page.</h2>
			</div>
			<p class="slds-p-left_medium" style="color:red">{errorMessage} </p>
		</div>
	</template>

    <div class="listdiv">
        <div class="slds-modal__content slds-p-vertical_medium">
            <div class="slds-text-heading_small slds-p-horizontal_large font_500 slds-text-body_small searchCompany">Search Company</div>
            <lightning-layout class="slds-p-horizontal_large slds-p-bottom_x-small lookup_css_h">
                <lightning-layout-item size="12" flexibility="auto" class="yourText">
                    <label class="slds-form-element__label"> <abbr class="slds-required" title="required">* </abbr>Company Name</label>
                    <c-navatar-single-lookup-lwc
                        obj-name ="Account"
                        search-placeholder="Search"
                        onlookupselected ={handleSelectedFirmRecord}
                        is-rec-selected="true"
                        onaccountselected ={handleAccountName}
                        contact-check = "true"
                    ></c-navatar-single-lookup-lwc>

                </lightning-layout-item>
            </lightning-layout>
        </div>
        <!-- Modal/Popup Box LWC footer starts here -->
        <footer class="slds-modal__footer cutomFooter">
            <lightning-button label="Back" title="Back" onclick={handleBack} class="slds-m-left_x-small">
            </lightning-button>
            <lightning-button variant="brand" label="Save" title="Save" onclick={handleSave}
                class="slds-m-left_x-small customBrandButton"></lightning-button>
        </footer>
    </div>
</template>
